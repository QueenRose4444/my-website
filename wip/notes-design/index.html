  function copyVal(v) { return Object.prototype.toString.call(v) === '[object Array]' ? v.slice() : v; }
  function withPreset(key, over) {
    var s = baseSettings(), k;
    var p = PRESETS[key] ? PRESETS[key].s : {};
    for (k in p) s[k] = copyVal(p[k]);
    for (k in (over || {})) s[k] = copyVal(over[k]);
    return s;
  }

  /* ===================== nodes ========================================== */
  var N = {};
  var SEQ = 0;
  function uid(pre) { SEQ += 1; return (pre || 'x') + '-' + SEQ; }

  function G(id, parent, name, preset, over, extra) {
    var n = { id: id, t: 'g', p: parent, name: name, preset: preset,
              s: withPreset(preset, over), owner: null, own: {}, order: SEQ += 1 };
    for (var k in (extra || {})) n[k] = extra[k];
    N[id] = n; return n;
  }
  function Nt(id, parent, name, extra) {
    var n = { id: id, t: 'n', p: parent, name: name, kind: 'page', body: '',
              created: '2026-08-01T10:00', updated: '2026-08-01T10:00',
              owner: 'rose', priv: false, unread: false, tags: [], order: SEQ += 1 };
    for (var k in (extra || {})) n[k] = extra[k];
    N[id] = n; return n;
  }

  var kidsCache = null;
  function kids(id) {
    if (!kidsCache) {
      kidsCache = {};
      Object.keys(N).forEach(function (k) {
        var pid = N[k].p || '@root';
        (kidsCache[pid] = kidsCache[pid] || []).push(N[k]);
      });
      Object.keys(kidsCache).forEach(function (k) {
        kidsCache[k].sort(function (a, b) { return a.order - b.order; });
      });
    }
    return (kidsCache[id || '@root'] || []).slice();
  }
  function bust() { kidsCache = null; }
  function chain(id) { var out = [], n = N[id]; while (n) { out.unshift(n); n = n.p ? N[n.p] : null; } return out; }
  /* The nearest GROUP at or above a node. A note's parent is not always a group —
     story chapters are notes inside a note — so nothing may read `.s` off `N[x.p]`. */
  function groupOf(n) {
    var c = n;
    while (c && c.t !== 'g') c = c.p ? N[c.p] : null;
    return c || null;
  }
  function groupOfId(id) { var n = N[id]; return n ? groupOf(n) : null; }
  function walk(id, fn) { kids(id).forEach(function (c) { fn(c); walk(c.id, fn); }); }
  function tally(id) {
    var g = 0, n = 0;
    walk(id, function (c) { if (c.t === 'g') g += 1; else n += 1; });
    return { groups: g, notes: n };
  }
  /* effective value of an inheritable setting: walk up until something is set here */
  function eff(id, key, isSetHere) {
    var c = chain(id).filter(function (x) { return x.t === 'g'; });
    for (var i = c.length - 1; i >= 0; i--) if (isSetHere(c[i])) return { v: c[i].s[key], from: c[i] };
    return { v: GLOBAL[key], from: null };
  }
  var GLOBAL = { notifyAdd: true, notifyEdit: false, layout: 'auto', share: 'nobody' };

  /* ---------- Alice: Project Gutenberg eBook #11, public domain, embedded whole ------ */
  var ALICE = {
    title: "Alice's Adventures in Wonderland",
    author: "Lewis Carroll",
    source: "Project Gutenberg eBook #11 — public domain",
    chapters: [
      { chapter: "CHAPTER I.", name: "Down the Rabbit-Hole", paras: [
        "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”",
        "So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.",
        "There was nothing so _very_ remarkable in that; nor did Alice think it so _very_ much out of the way to hear the Rabbit say to itself, “Oh dear! Oh dear! I shall be late!” (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually _took a watch out of its waistcoat-pocket_, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.",
        "In another moment down went Alice after it, never once considering how in the world she was to get out again.",
        "The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.",
        "Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled “ORANGE MARMALADE”, but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it.",
        "“Well!” thought Alice to herself, “after such a fall as this, I shall think nothing of tumbling down stairs! How brave they’ll all think me at home! Why, I wouldn’t say anything about it, even if I fell off the top of the house!” (Which was very likely true.)",
        "Down, down, down. Would the fall _never_ come to an end? “I wonder how many miles I’ve fallen by this time?” she said aloud. “I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—” (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a _very_ good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) “—yes, that’s about the right distance—but then I wonder what Latitude or Longitude I’ve got to?” (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)",
        "Presently she began again. “I wonder if I shall fall right _through_ the earth! How funny it’ll seem to come out among the people that walk with their heads downward! The Antipathies, I think—” (she was rather glad there _was_ no one listening, this time, as it didn’t sound at all the right word) “—but I shall have to ask them what the name of the country is, you know. Please, Ma’am, is this New Zealand or Australia?” (and she tried to curtsey as she spoke—fancy _curtseying_ as you’re falling through the air! Do you think you could manage it?) “And what an ignorant little girl she’ll think me for asking! No, it’ll never do to ask: perhaps I shall see it written up somewhere.”",
        "Down, down, down. There was nothing else to do, so Alice soon began talking again. “Dinah’ll miss me very much to-night, I should think!” (Dinah was the cat.) “I hope they’ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I’m afraid, but you might catch a bat, and that’s very like a mouse, you know. But do cats eat bats, I wonder?” And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, “Do cats eat bats? Do cats eat bats?” and sometimes, “Do bats eat cats?” for, you see, as she couldn’t answer either question, it didn’t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, “Now, Dinah, tell me the truth: did you ever eat a bat?” when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.",
        "Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, “Oh my ears and whiskers, how late it’s getting!” She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.",
        "There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.",
        "Suddenly she came upon a little three-legged table, all made of solid glass; there was nothing on it except a tiny golden key, and Alice’s first thought was that it might belong to one of the doors of the hall; but, alas! either the locks were too large, or the key was too small, but at any rate it would not open any of them. However, on the second time round, she came upon a low curtain she had not noticed before, and behind it was a little door about fifteen inches high: she tried the little golden key in the lock, and to her great delight it fitted!",
        "Alice opened the door and found that it led into a small passage, not much larger than a rat-hole: she knelt down and looked along the passage into the loveliest garden you ever saw. How she longed to get out of that dark hall, and wander about among those beds of bright flowers and those cool fountains, but she could not even get her head through the doorway; “and even if my head would go through,” thought poor Alice, “it would be of very little use without my shoulders. Oh, how I wish I could shut up like a telescope! I think I could, if I only knew how to begin.” For, you see, so many out-of-the-way things had happened lately, that Alice had begun to think that very few things indeed were really impossible.",
        "There seemed to be no use in waiting by the little door, so she went back to the table, half hoping she might find another key on it, or at any rate a book of rules for shutting people up like telescopes: this time she found a little bottle on it, (“which certainly was not here before,” said Alice,) and round the neck of the bottle was a paper label, with the words “DRINK ME,” beautifully printed on it in large letters.",
        "It was all very well to say “Drink me,” but the wise little Alice was not going to do _that_ in a hurry. “No, I’ll look first,” she said, “and see whether it’s marked ‘_poison_’ or not”; for she had read several nice little histories about children who had got burnt, and eaten up by wild beasts and other unpleasant things, all because they _would_ not remember the simple rules their friends had taught them: such as, that a red-hot poker will burn you if you hold it too long; and that if you cut your finger _very_ deeply with a knife, it usually bleeds; and she had never forgotten that, if you drink much from a bottle marked “poison,” it is almost certain to disagree with you, sooner or later.",
        "However, this bottle was _not_ marked “poison,” so Alice ventured to taste it, and finding it very nice, (it had, in fact, a sort of mixed flavour of cherry-tart, custard, pine-apple, roast turkey, toffee, and hot buttered toast,) she very soon finished it off.",
        "*      *      *      *      *      *      *",
        "*      *      *      *      *      *",
        "*      *      *      *      *      *      *",
        "“What a curious feeling!” said Alice; “I must be shutting up like a telescope.”",
        "And so it was indeed: she was now only ten inches high, and her face brightened up at the thought that she was now the right size for going through the little door into that lovely garden. First, however, she waited for a few minutes to see if she was going to shrink any further: she felt a little nervous about this; “for it might end, you know,” said Alice to herself, “in my going out altogether, like a candle. I wonder what I should be like then?” And she tried to fancy what the flame of a candle is like after the candle is blown out, for she could not remember ever having seen such a thing.",
        "After a while, finding that nothing more happened, she decided on going into the garden at once; but, alas for poor Alice! when she got to the door, she found she had forgotten the little golden key, and when she went back to the table for it, she found she could not possibly reach it: she could see it quite plainly through the glass, and she tried her best to climb up one of the legs of the table, but it was too slippery; and when she had tired herself out with trying, the poor little thing sat down and cried.",
        "“Come, there’s no use in crying like that!” said Alice to herself, rather sharply; “I advise you to leave off this minute!” She generally gave herself very good advice, (though she very seldom followed it), and sometimes she scolded herself so severely as to bring tears into her eyes; and once she remembered trying to box her own ears for having cheated herself in a game of croquet she was playing against herself, for this curious child was very fond of pretending to be two people. “But it’s no use now,” thought poor Alice, “to pretend to be two people! Why, there’s hardly enough of me left to make _one_ respectable person!”",
        "Soon her eye fell on a little glass box that was lying under the table: she opened it, and found in it a very small cake, on which the words “EAT ME” were beautifully marked in currants. “Well, I’ll eat it,” said Alice, “and if it makes me grow larger, I can reach the key; and if it makes me grow smaller, I can creep under the door; so either way I’ll get into the garden, and I don’t care which happens!”",
        "She ate a little bit, and said anxiously to herself, “Which way? Which way?”, holding her hand on the top of her head to feel which way it was growing, and she was quite surprised to find that she remained the same size: to be sure, this generally happens when one eats cake, but Alice had got so much into the way of expecting nothing but out-of-the-way things to happen, that it seemed quite dull and stupid for life to go on in the common way.",
        "So she set to work, and very soon finished off the cake.",
        "*      *      *      *      *      *      *",
        "*      *      *      *      *      *",
        "*      *      *      *      *      *      *"
      ] },
      { chapter: "CHAPTER II.", name: "The Pool of Tears", paras: [
        "“Curiouser and curiouser!” cried Alice (she was so much surprised, that for the moment she quite forgot how to speak good English); “now I’m opening out like the largest telescope that ever was! Good-bye, feet!” (for when she looked down at her feet, they seemed to be almost out of sight, they were getting so far off). “Oh, my poor little feet, I wonder who will put on your shoes and stockings for you now, dears? I’m sure _I_ shan’t be able! I shall be a great deal too far off to trouble myself about you: you must manage the best way you can;—but I must be kind to them,” thought Alice, “or perhaps they won’t walk the way I want to go! Let me see: I’ll give them a new pair of boots every Christmas.”",
        "And she went on planning to herself how she would manage it. “They must go by the carrier,” she thought; “and how funny it’ll seem, sending presents to one’s own feet! And how odd the directions will look!",
        "_Alice’s Right Foot, Esq., Hearthrug, near the Fender,_ (_with Alice’s love_).",
        "Oh dear, what nonsense I’m talking!”",
        "Just then her head struck against the roof of the hall: in fact she was now more than nine feet high, and she at once took up the little golden key and hurried off to the garden door.",
        "Poor Alice! It was as much as she could do, lying down on one side, to look through into the garden with one eye; but to get through was more hopeless than ever: she sat down and began to cry again.",
        "“You ought to be ashamed of yourself,” said Alice, “a great girl like you,” (she might well say this), “to go on crying in this way! Stop this moment, I tell you!” But she went on all the same, shedding gallons of tears, until there was a large pool all round her, about four inches deep and reaching half down the hall.",
        "After a time she heard a little pattering of feet in the distance, and she hastily dried her eyes to see what was coming. It was the White Rabbit returning, splendidly dressed, with a pair of white kid gloves in one hand and a large fan in the other: he came trotting along in a great hurry, muttering to himself as he came, “Oh! the Duchess, the Duchess! Oh! won’t she be savage if I’ve kept her waiting!” Alice felt so desperate that she was ready to ask help of any one; so, when the Rabbit came near her, she began, in a low, timid voice, “If you please, sir—” The Rabbit started violently, dropped the white kid gloves and the fan, and skurried away into the darkness as hard as he could go.",
        "Alice took up the fan and gloves, and, as the hall was very hot, she kept fanning herself all the time she went on talking: “Dear, dear! How queer everything is to-day! And yesterday things went on just as usual. I wonder if I’ve been changed in the night? Let me think: was I the same when I got up this morning? I almost think I can remember feeling a little different. But if I’m not the same, the next question is, Who in the world am I? Ah, _that’s_ the great puzzle!” And she began thinking over all the children she knew that were of the same age as herself, to see if she could have been changed for any of them.",
        "“I’m sure I’m not Ada,” she said, “for her hair goes in such long ringlets, and mine doesn’t go in ringlets at all; and I’m sure I can’t be Mabel, for I know all sorts of things, and she, oh! she knows such a very little! Besides, _she’s_ she, and _I’m_ I, and—oh dear, how puzzling it all is! I’ll try if I know all the things I used to know. Let me see: four times five is twelve, and four times six is thirteen, and four times seven is—oh dear! I shall never get to twenty at that rate! However, the Multiplication Table doesn’t signify: let’s try Geography. London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, _that’s_ all wrong, I’m certain! I must have been changed for Mabel! I’ll try and say ‘_How doth the little_—’” and she crossed her hands on her lap as if she were saying lessons, and began to repeat it, but her voice sounded hoarse and strange, and the words did not come the same as they used to do:—",
        "“How doth the little crocodile Improve his shining tail, And pour the waters of the Nile On every golden scale!",
        "“How cheerfully he seems to grin, How neatly spread his claws, And welcome little fishes in With gently smiling jaws!”",
        "“I’m sure those are not the right words,” said poor Alice, and her eyes filled with tears again as she went on, “I must be Mabel after all, and I shall have to go and live in that poky little house, and have next to no toys to play with, and oh! ever so many lessons to learn! No, I’ve made up my mind about it; if I’m Mabel, I’ll stay down here! It’ll be no use their putting their heads down and saying ‘Come up again, dear!’ I shall only look up and say ‘Who am I then? Tell me that first, and then, if I like being that person, I’ll come up: if not, I’ll stay down here till I’m somebody else’—but, oh dear!” cried Alice, with a sudden burst of tears, “I do wish they _would_ put their heads down! I am so _very_ tired of being all alone here!”",
        "As she said this she looked down at her hands, and was surprised to see that she had put on one of the Rabbit’s little white kid gloves while she was talking. “How _can_ I have done that?” she thought. “I must be growing small again.” She got up and went to the table to measure herself by it, and found that, as nearly as she could guess, she was now about two feet high, and was going on shrinking rapidly: she soon found out that the cause of this was the fan she was holding, and she dropped it hastily, just in time to avoid shrinking away altogether.",
        "“That _was_ a narrow escape!” said Alice, a good deal frightened at the sudden change, but very glad to find herself still in existence; “and now for the garden!” and she ran with all speed back to the little door: but, alas! the little door was shut again, and the little golden key was lying on the glass table as before, “and things are worse than ever,” thought the poor child, “for I never was so small as this before, never! And I declare it’s too bad, that it is!”",
        "As she said these words her foot slipped, and in another moment, splash! she was up to her chin in salt water. Her first idea was that she had somehow fallen into the sea, “and in that case I can go back by railway,” she said to herself. (Alice had been to the seaside once in her life, and had come to the general conclusion, that wherever you go to on the English coast you find a number of bathing machines in the sea, some children digging in the sand with wooden spades, then a row of lodging houses, and behind them a railway station.) However, she soon made out that she was in the pool of tears which she had wept when she was nine feet high.",
        "“I wish I hadn’t cried so much!” said Alice, as she swam about, trying to find her way out. “I shall be punished for it now, I suppose, by being drowned in my own tears! That _will_ be a queer thing, to be sure! However, everything is queer to-day.”",
        "Just then she heard something splashing about in the pool a little way off, and she swam nearer to make out what it was: at first she thought it must be a walrus or hippopotamus, but then she remembered how small she was now, and she soon made out that it was only a mouse that had slipped in like herself.",
        "“Would it be of any use, now,” thought Alice, “to speak to this mouse? Everything is so out-of-the-way down here, that I should think very likely it can talk: at any rate, there’s no harm in trying.” So she began: “O Mouse, do you know the way out of this pool? I am very tired of swimming about here, O Mouse!” (Alice thought this must be the right way of speaking to a mouse: she had never done such a thing before, but she remembered having seen in her brother’s Latin Grammar, “A mouse—of a mouse—to a mouse—a mouse—O mouse!”) The Mouse looked at her rather inquisitively, and seemed to her to wink with one of its little eyes, but it said nothing.",
        "“Perhaps it doesn’t understand English,” thought Alice; “I daresay it’s a French mouse, come over with William the Conqueror.” (For, with all her knowledge of history, Alice had no very clear notion how long ago anything had happened.) So she began again: “Où est ma chatte?” which was the first sentence in her French lesson-book. The Mouse gave a sudden leap out of the water, and seemed to quiver all over with fright. “Oh, I beg your pardon!” cried Alice hastily, afraid that she had hurt the poor animal’s feelings. “I quite forgot you didn’t like cats.”",
        "“Not like cats!” cried the Mouse, in a shrill, passionate voice. “Would _you_ like cats if you were me?”",
        "“Well, perhaps not,” said Alice in a soothing tone: “don’t be angry about it. And yet I wish I could show you our cat Dinah: I think you’d take a fancy to cats if you could only see her. She is such a dear quiet thing,” Alice went on, half to herself, as she swam lazily about in the pool, “and she sits purring so nicely by the fire, licking her paws and washing her face—and she is such a nice soft thing to nurse—and she’s such a capital one for catching mice—oh, I beg your pardon!” cried Alice again, for this time the Mouse was bristling all over, and she felt certain it must be really offended. “We won’t talk about her any more if you’d rather not.”",
        "“We indeed!” cried the Mouse, who was trembling down to the end of his tail. “As if _I_ would talk on such a subject! Our family always _hated_ cats: nasty, low, vulgar things! Don’t let me hear the name again!”",
        "“I won’t indeed!” said Alice, in a great hurry to change the subject of conversation. “Are you—are you fond—of—of dogs?” The Mouse did not answer, so Alice went on eagerly: “There is such a nice little dog near our house I should like to show you! A little bright-eyed terrier, you know, with oh, such long curly brown hair! And it’ll fetch things when you throw them, and it’ll sit up and beg for its dinner, and all sorts of things—I can’t remember half of them—and it belongs to a farmer, you know, and he says it’s so useful, it’s worth a hundred pounds! He says it kills all the rats and—oh dear!” cried Alice in a sorrowful tone, “I’m afraid I’ve offended it again!” For the Mouse was swimming away from her as hard as it could go, and making quite a commotion in the pool as it went.",
        "So she called softly after it, “Mouse dear! Do come back again, and we won’t talk about cats or dogs either, if you don’t like them!” When the Mouse heard this, it turned round and swam slowly back to her: its face was quite pale (with passion, Alice thought), and it said in a low trembling voice, “Let us get to the shore, and then I’ll tell you my history, and you’ll understand why it is I hate cats and dogs.”",
        "It was high time to go, for the pool was getting quite crowded with the birds and animals that had fallen into it: there were a Duck and a Dodo, a Lory and an Eaglet, and several other curious creatures. Alice led the way, and the whole party swam to the shore."
      ] },
      { chapter: "CHAPTER III.", name: "A Caucus-Race and a Long Tale", paras: [
        "They were indeed a queer-looking party that assembled on the bank—the birds with draggled feathers, the animals with their fur clinging close to them, and all dripping wet, cross, and uncomfortable.",
        "The first question of course was, how to get dry again: they had a consultation about this, and after a few minutes it seemed quite natural to Alice to find herself talking familiarly with them, as if she had known them all her life. Indeed, she had quite a long argument with the Lory, who at last turned sulky, and would only say, “I am older than you, and must know better;” and this Alice would not allow without knowing how old it was, and, as the Lory positively refused to tell its age, there was no more to be said.",
        "At last the Mouse, who seemed to be a person of authority among them, called out, “Sit down, all of you, and listen to me! _I’ll_ soon make you dry enough!” They all sat down at once, in a large ring, with the Mouse in the middle. Alice kept her eyes anxiously fixed on it, for she felt sure she would catch a bad cold if she did not get dry very soon.",
        "“Ahem!” said the Mouse with an important air, “are you all ready? This is the driest thing I know. Silence all round, if you please! ‘William the Conqueror, whose cause was favoured by the pope, was soon submitted to by the English, who wanted leaders, and had been of late much accustomed to usurpation and conquest. Edwin and Morcar, the earls of Mercia and Northumbria—’”",
        "“Ugh!” said the Lory, with a shiver.",
        "“I beg your pardon!” said the Mouse, frowning, but very politely: “Did you speak?”",
        "“Not I!” said the Lory hastily.",
        "“I thought you did,” said the Mouse. “—I proceed. ‘Edwin and Morcar, the earls of Mercia and Northumbria, declared for him: and even Stigand, the patriotic archbishop of Canterbury, found it advisable—’”",
        "“Found _what_?” said the Duck.",
        "“Found _it_,” the Mouse replied rather crossly: “of course you know what ‘it’ means.”",
        "“I know what ‘it’ means well enough, when _I_ find a thing,” said the Duck: “it’s generally a frog or a worm. The question is, what did the archbishop find?”",
        "The Mouse did not notice this question, but hurriedly went on, “‘—found it advisable to go with Edgar Atheling to meet William and offer him the crown. William’s conduct at first was moderate. But the insolence of his Normans—’ How are you getting on now, my dear?” it continued, turning to Alice as it spoke.",
        "“As wet as ever,” said Alice in a melancholy tone: “it doesn’t seem to dry me at all.”",
        "“In that case,” said the Dodo solemnly, rising to its feet, “I move that the meeting adjourn, for the immediate adoption of more energetic remedies—”",
        "“Speak English!” said the Eaglet. “I don’t know the meaning of half those long words, and, what’s more, I don’t believe you do either!” And the Eaglet bent down its head to hide a smile: some of the other birds tittered audibly.",
        "“What I was going to say,” said the Dodo in an offended tone, “was, that the best thing to get us dry would be a Caucus-race.”",
        "“What _is_ a Caucus-race?” said Alice; not that she wanted much to know, but the Dodo had paused as if it thought that _somebody_ ought to speak, and no one else seemed inclined to say anything.",
        "“Why,” said the Dodo, “the best way to explain it is to do it.” (And, as you might like to try the thing yourself, some winter day, I will tell you how the Dodo managed it.)",
        "First it marked out a race-course, in a sort of circle, (“the exact shape doesn’t matter,” it said,) and then all the party were placed along the course, here and there. There was no “One, two, three, and away,” but they began running when they liked, and left off when they liked, so that it was not easy to know when the race was over. However, when they had been running half an hour or so, and were quite dry again, the Dodo suddenly called out “The race is over!” and they all crowded round it, panting, and asking, “But who has won?”",
        "This question the Dodo could not answer without a great deal of thought, and it sat for a long time with one finger pressed upon its forehead (the position in which you usually see Shakespeare, in the pictures of him), while the rest waited in silence. At last the Dodo said, “_Everybody_ has won, and all must have prizes.”",
        "“But who is to give the prizes?” quite a chorus of voices asked.",
        "“Why, _she_, of course,” said the Dodo, pointing to Alice with one finger; and the whole party at once crowded round her, calling out in a confused way, “Prizes! Prizes!”",
        "Alice had no idea what to do, and in despair she put her hand in her pocket, and pulled out a box of comfits, (luckily the salt water had not got into it), and handed them round as prizes. There was exactly one a-piece, all round.",
        "“But she must have a prize herself, you know,” said the Mouse.",
        "“Of course,” the Dodo replied very gravely. “What else have you got in your pocket?” he went on, turning to Alice.",
        "“Only a thimble,” said Alice sadly.",
        "“Hand it over here,” said the Dodo.",
        "Then they all crowded round her once more, while the Dodo solemnly presented the thimble, saying “We beg your acceptance of this elegant thimble;” and, when it had finished this short speech, they all cheered.",
        "Alice thought the whole thing very absurd, but they all looked so grave that she did not dare to laugh; and, as she could not think of anything to say, she simply bowed, and took the thimble, looking as solemn as she could.",
        "The next thing was to eat the comfits: this caused some noise and confusion, as the large birds complained that they could not taste theirs, and the small ones choked and had to be patted on the back. However, it was over at last, and they sat down again in a ring, and begged the Mouse to tell them something more.",
        "“You promised to tell me your history, you know,” said Alice, “and why it is you hate—C and D,” she added in a whisper, half afraid that it would be offended again.",
        "“Mine is a long and a sad tale!” said the Mouse, turning to Alice, and sighing.",
        "“It _is_ a long tail, certainly,” said Alice, looking down with wonder at the Mouse’s tail; “but why do you call it sad?” And she kept on puzzling about it while the Mouse was speaking, so that her idea of the tale was something like this:—",
        "“Fury said to a mouse, That he met in the house, ‘Let us both go to law: _I_ will prosecute _you_.—Come, I’ll take no denial; We must have a trial: For really this morning I’ve nothing to do.’ Said the mouse to the cur, ‘Such a trial, dear sir, With no jury or judge, would be wasting our breath.’ ‘I’ll be judge, I’ll be jury,’ Said cunning old Fury: ‘I’ll try the whole cause, and condemn you to death.’”",
        "“You are not attending!” said the Mouse to Alice severely. “What are you thinking of?”",
        "“I beg your pardon,” said Alice very humbly: “you had got to the fifth bend, I think?”",
        "“I had _not!_” cried the Mouse, sharply and very angrily.",
        "“A knot!” said Alice, always ready to make herself useful, and looking anxiously about her. “Oh, do let me help to undo it!”",
        "“I shall do nothing of the sort,” said the Mouse, getting up and walking away. “You insult me by talking such nonsense!”",
        "“I didn’t mean it!” pleaded poor Alice. “But you’re so easily offended, you know!”",
        "The Mouse only growled in reply.",
        "“Please come back and finish your story!” Alice called after it; and the others all joined in chorus, “Yes, please do!” but the Mouse only shook its head impatiently, and walked a little quicker.",
        "“What a pity it wouldn’t stay!” sighed the Lory, as soon as it was quite out of sight; and an old Crab took the opportunity of saying to her daughter “Ah, my dear! Let this be a lesson to you never to lose _your_ temper!” “Hold your tongue, Ma!” said the young Crab, a little snappishly. “You’re enough to try the patience of an oyster!”",
        "“I wish I had our Dinah here, I know I do!” said Alice aloud, addressing nobody in particular. “She’d soon fetch it back!”",
        "“And who is Dinah, if I might venture to ask the question?” said the Lory.",
        "Alice replied eagerly, for she was always ready to talk about her pet: “Dinah’s our cat. And she’s such a capital one for catching mice you can’t think! And oh, I wish you could see her after the birds! Why, she’ll eat a little bird as soon as look at it!”",
        "This speech caused a remarkable sensation among the party. Some of the birds hurried off at once: one old Magpie began wrapping itself up very carefully, remarking, “I really must be getting home; the night-air doesn’t suit my throat!” and a Canary called out in a trembling voice to its children, “Come away, my dears! It’s high time you were all in bed!” On various pretexts they all moved off, and Alice was soon left alone.",
        "“I wish I hadn’t mentioned Dinah!” she said to herself in a melancholy tone. “Nobody seems to like her, down here, and I’m sure she’s the best cat in the world! Oh, my dear Dinah! I wonder if I shall ever see you any more!” And here poor Alice began to cry again, for she felt very lonely and low-spirited. In a little while, however, she again heard a little pattering of footsteps in the distance, and she looked up eagerly, half hoping that the Mouse had changed his mind, and was coming back to finish his story."
      ] },
      { chapter: "CHAPTER IV.", name: "The Rabbit Sends in a Little Bill", paras: [
        "It was the White Rabbit, trotting slowly back again, and looking anxiously about as it went, as if it had lost something; and she heard it muttering to itself “The Duchess! The Duchess! Oh my dear paws! Oh my fur and whiskers! She’ll get me executed, as sure as ferrets are ferrets! Where _can_ I have dropped them, I wonder?” Alice guessed in a moment that it was looking for the fan and the pair of white kid gloves, and she very good-naturedly began hunting about for them, but they were nowhere to be seen—everything seemed to have changed since her swim in the pool, and the great hall, with the glass table and the little door, had vanished completely.",
        "Very soon the Rabbit noticed Alice, as she went hunting about, and called out to her in an angry tone, “Why, Mary Ann, what _are_ you doing out here? Run home this moment, and fetch me a pair of gloves and a fan! Quick, now!” And Alice was so much frightened that she ran off at once in the direction it pointed to, without trying to explain the mistake it had made.",
        "“He took me for his housemaid,” she said to herself as she ran. “How surprised he’ll be when he finds out who I am! But I’d better take him his fan and gloves—that is, if I can find them.” As she said this, she came upon a neat little house, on the door of which was a bright brass plate with the name “W. RABBIT,” engraved upon it. She went in without knocking, and hurried upstairs, in great fear lest she should meet the real Mary Ann, and be turned out of the house before she had found the fan and gloves.",
        "“How queer it seems,” Alice said to herself, “to be going messages for a rabbit! I suppose Dinah’ll be sending me on messages next!” And she began fancying the sort of thing that would happen: “‘Miss Alice! Come here directly, and get ready for your walk!’ ‘Coming in a minute, nurse! But I’ve got to see that the mouse doesn’t get out.’ Only I don’t think,” Alice went on, “that they’d let Dinah stop in the house if it began ordering people about like that!”",
        "By this time she had found her way into a tidy little room with a table in the window, and on it (as she had hoped) a fan and two or three pairs of tiny white kid gloves: she took up the fan and a pair of the gloves, and was just going to leave the room, when her eye fell upon a little bottle that stood near the looking-glass. There was no label this time with the words “DRINK ME,” but nevertheless she uncorked it and put it to her lips. “I know _something_ interesting is sure to happen,” she said to herself, “whenever I eat or drink anything; so I’ll just see what this bottle does. I do hope it’ll make me grow large again, for really I’m quite tired of being such a tiny little thing!”",
        "It did so indeed, and much sooner than she had expected: before she had drunk half the bottle, she found her head pressing against the ceiling, and had to stoop to save her neck from being broken. She hastily put down the bottle, saying to herself “That’s quite enough—I hope I shan’t grow any more—As it is, I can’t get out at the door—I do wish I hadn’t drunk quite so much!”",
        "Alas! it was too late to wish that! She went on growing, and growing, and very soon had to kneel down on the floor: in another minute there was not even room for this, and she tried the effect of lying down with one elbow against the door, and the other arm curled round her head. Still she went on growing, and, as a last resource, she put one arm out of the window, and one foot up the chimney, and said to herself “Now I can do no more, whatever happens. What _will_ become of me?”",
        "Luckily for Alice, the little magic bottle had now had its full effect, and she grew no larger: still it was very uncomfortable, and, as there seemed to be no sort of chance of her ever getting out of the room again, no wonder she felt unhappy.",
        "“It was much pleasanter at home,” thought poor Alice, “when one wasn’t always growing larger and smaller, and being ordered about by mice and rabbits. I almost wish I hadn’t gone down that rabbit-hole—and yet—and yet—it’s rather curious, you know, this sort of life! I do wonder what _can_ have happened to me! When I used to read fairy-tales, I fancied that kind of thing never happened, and now here I am in the middle of one! There ought to be a book written about me, that there ought! And when I grow up, I’ll write one—but I’m grown up now,” she added in a sorrowful tone; “at least there’s no room to grow up any more _here_.”",
        "“But then,” thought Alice, “shall I _never_ get any older than I am now? That’ll be a comfort, one way—never to be an old woman—but then—always to have lessons to learn! Oh, I shouldn’t like _that!_”",
        "“Oh, you foolish Alice!” she answered herself. “How can you learn lessons in here? Why, there’s hardly room for _you_, and no room at all for any lesson-books!”",
        "And so she went on, taking first one side and then the other, and making quite a conversation of it altogether; but after a few minutes she heard a voice outside, and stopped to listen.",
        "“Mary Ann! Mary Ann!” said the voice. “Fetch me my gloves this moment!” Then came a little pattering of feet on the stairs. Alice knew it was the Rabbit coming to look for her, and she trembled till she shook the house, quite forgetting that she was now about a thousand times as large as the Rabbit, and had no reason to be afraid of it.",
        "Presently the Rabbit came up to the door, and tried to open it; but, as the door opened inwards, and Alice’s elbow was pressed hard against it, that attempt proved a failure. Alice heard it say to itself “Then I’ll go round and get in at the window.”",
        "“_That_ you won’t!” thought Alice, and, after waiting till she fancied she heard the Rabbit just under the window, she suddenly spread out her hand, and made a snatch in the air. She did not get hold of anything, but she heard a little shriek and a fall, and a crash of broken glass, from which she concluded that it was just possible it had fallen into a cucumber-frame, or something of the sort.",
        "Next came an angry voice—the Rabbit’s—“Pat! Pat! Where are you?” And then a voice she had never heard before, “Sure then I’m here! Digging for apples, yer honour!”",
        "“Digging for apples, indeed!” said the Rabbit angrily. “Here! Come and help me out of _this!_” (Sounds of more broken glass.)",
        "“Now tell me, Pat, what’s that in the window?”",
        "“Sure, it’s an arm, yer honour!” (He pronounced it “arrum.”)",
        "“An arm, you goose! Who ever saw one that size? Why, it fills the whole window!”",
        "“Sure, it does, yer honour: but it’s an arm for all that.”",
        "“Well, it’s got no business there, at any rate: go and take it away!”",
        "There was a long silence after this, and Alice could only hear whispers now and then; such as, “Sure, I don’t like it, yer honour, at all, at all!” “Do as I tell you, you coward!” and at last she spread out her hand again, and made another snatch in the air. This time there were _two_ little shrieks, and more sounds of broken glass. “What a number of cucumber-frames there must be!” thought Alice. “I wonder what they’ll do next! As for pulling me out of the window, I only wish they _could!_ I’m sure _I_ don’t want to stay in here any longer!”",
        "She waited for some time without hearing anything more: at last came a rumbling of little cartwheels, and the sound of a good many voices all talking together: she made out the words: “Where’s the other ladder?—Why, I hadn’t to bring but one; Bill’s got the other—Bill! fetch it here, lad!—Here, put ’em up at this corner—No, tie ’em together first—they don’t reach half high enough yet—Oh! they’ll do well enough; don’t be particular—Here, Bill! catch hold of this rope—Will the roof bear?—Mind that loose slate—Oh, it’s coming down! Heads below!” (a loud crash)—“Now, who did that?—It was Bill, I fancy—Who’s to go down the chimney?—Nay, _I_ shan’t! _You_ do it!—_That_ I won’t, then!—Bill’s to go down—Here, Bill! the master says you’re to go down the chimney!”",
        "“Oh! So Bill’s got to come down the chimney, has he?” said Alice to herself. “Shy, they seem to put everything upon Bill! I wouldn’t be in Bill’s place for a good deal: this fireplace is narrow, to be sure; but I _think_ I can kick a little!”",
        "She drew her foot as far down the chimney as she could, and waited till she heard a little animal (she couldn’t guess of what sort it was) scratching and scrambling about in the chimney close above her: then, saying to herself “This is Bill,” she gave one sharp kick, and waited to see what would happen next.",
        "The first thing she heard was a general chorus of “There goes Bill!” then the Rabbit’s voice along—“Catch him, you by the hedge!” then silence, and then another confusion of voices—“Hold up his head—Brandy now—Don’t choke him—How was it, old fellow? What happened to you? Tell us all about it!”",
        "Last came a little feeble, squeaking voice, (“That’s Bill,” thought Alice,) “Well, I hardly know—No more, thank ye; I’m better now—but I’m a deal too flustered to tell you—all I know is, something comes at me like a Jack-in-the-box, and up I goes like a sky-rocket!”",
        "“So you did, old fellow!” said the others.",
        "“We must burn the house down!” said the Rabbit’s voice; and Alice called out as loud as she could, “If you do, I’ll set Dinah at you!”",
        "There was a dead silence instantly, and Alice thought to herself, “I wonder what they _will_ do next! If they had any sense, they’d take the roof off.” After a minute or two, they began moving about again, and Alice heard the Rabbit say, “A barrowful will do, to begin with.”",
        "“A barrowful of _what?_” thought Alice; but she had not long to doubt, for the next moment a shower of little pebbles came rattling in at the window, and some of them hit her in the face. “I’ll put a stop to this,” she said to herself, and shouted out, “You’d better not do that again!” which produced another dead silence.",
        "Alice noticed with some surprise that the pebbles were all turning into little cakes as they lay on the floor, and a bright idea came into her head. “If I eat one of these cakes,” she thought, “it’s sure to make _some_ change in my size; and as it can’t possibly make me larger, it must make me smaller, I suppose.”",
        "So she swallowed one of the cakes, and was delighted to find that she began shrinking directly. As soon as she was small enough to get through the door, she ran out of the house, and found quite a crowd of little animals and birds waiting outside. The poor little Lizard, Bill, was in the middle, being held up by two guinea-pigs, who were giving it something out of a bottle. They all made a rush at Alice the moment she appeared; but she ran off as hard as she could, and soon found herself safe in a thick wood.",
        "“The first thing I’ve got to do,” said Alice to herself, as she wandered about in the wood, “is to grow to my right size again; and the second thing is to find my way into that lovely garden. I think that will be the best plan.”",

      themes.map(function (t) {
        return '<button class="menu-item" data-a="theme" data-v="' + t[0] + '">' +
          (S.themePref === t[0] ? ico('check') : '<span style="width:1em"></span>') + t[1] + '</button>';
      }).join('') +
      '<div class="menu-sep"></div><div class="menu-label">Density</div>' +
      dens.map(function (d) {
        return '<button class="menu-item" data-a="density" data-v="' + d[0] + '">' +
          (S.density === d[0] ? ico('check') : '<span style="width:1em"></span>') + d[1] + '</button>';
      }).join('') +
      '<div class="menu-sep"></div><div class="menu-label">Accent</div>' +
      '<div style="padding:2px 8px 8px">' + swatches(S.accent, 'accent', '', '', true) + '</div>' +
      '</div>';
  }
  function currentGroupId() {
    var r = S.route;
    if (r.v === 'group') return r.id;
    if (r.v === 'note' || r.v === 'read') { var pg = groupOfId(r.id); return pg ? pg.id : null; }
    if (r.v === 'gset') return r.id;
    return null;
  }
  function crumbTitle() {
    var id = S.route.id;
    if (!id || !N[id]) return 'Home';
    var n = N[id]; return n.p ? N[n.p].name : 'Home';
  }
  function paintPlaces() {
    var roots = kids(null);
    var here = S.route.id && N[S.route.id] ? chain(S.route.id) : [];
    var un = allUnread().length;
    var html = '<div class="places-label">Places</div>' +
      place('home', 'home', 'Home', S.route.v === 'home') +
      place('search', 'search', 'Search', S.route.v === 'search') +
      place('shuffle', 'shuffle', 'Shuffle', false) +
      place('goinbox', 'bell', 'What is new', S.route.v === 'inbox', un ? '<span class="dot"></span>' : '');
    html += '<div class="places-label">Groups</div>';
    roots.forEach(function (g) {
      html += '<button class="place" data-a="open" data-i="' + g.id + '" aria-current="' + (here[0] && here[0].id === g.id ? 'true' : 'false') + '"' + gcAttr(g.id) + '>' +
        '<span style="width:16px;text-align:center;color:var(--accent)">' + iconHtml(g.s.icon) + '</span>' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(g.name) + '</span>' +
        (unreadIn(g.id) ? '<span class="dot"></span>' : '<span class="count num">' + tally(g.id).notes + '</span>') + '</button>';
    });
    if (here.length > 1) {
      html += '<div class="places-label">You are here</div><div class="spine">';
      html += '<button class="spine-step" data-a="home"><span class="bead"></span><span class="lbl">Home</span></button>';
      here.forEach(function (n, i) {
        html += '<button class="spine-step' + (i === here.length - 1 ? ' here' : '') + '" data-a="open" data-i="' + n.id + '">' +
          '<span class="bead"></span><span class="lbl">' + esc(n.name) + '</span></button>';
      });
      html += '</div>';
    }
    $('rn-places').innerHTML = html;
  }
  function place(a, i, label, cur, tail) {
    return '<button class="place" data-a="' + a + '" aria-current="' + (cur ? 'true' : 'false') + '">' +
      ico(i) + '<span>' + label + '</span>' + (tail || '') + '</button>';
  }
  function crumbs(id) {
    var c = chain(id), out = ['<button data-a="home">Home</button>'];
    c.forEach(function (n, i) {
      out.push('<span class="sep">/</span>');
      if (i === c.length - 1) out.push('<span class="now">' + esc(n.name) + '</span>');
      else out.push('<button data-a="open" data-i="' + n.id + '">' + esc(n.name) + '</button>');
    });
    return '<div class="crumbs">' + out.join('') + '</div>';
  }

  /* ===================== views ========================================= */
  function render() {
    var r = S.route, v = '';
    if (r.v === 'home') v = viewHome();
    else if (r.v === 'group') v = viewGroup(N[r.id]);
    else if (r.v === 'note') v = viewNote(N[r.id]);
    else if (r.v === 'read') v = viewReader(N[r.id]);
    else if (r.v === 'gset') v = viewGSet(N[r.id]);
    else if (r.v === 'notify') v = viewNotify();
    else if (r.v === 'app') v = viewApp();
    else if (r.v === 'inbox') v = viewInbox();
    else if (r.v === 'search') v = viewSearch();
    else if (r.v === 'newgroup') v = viewNewGroup();
    else { S.route = r = { v: 'home' }; v = viewHome(); }
    /* every screen that belongs to a group is painted in that group's colour */
    var gc = gcAttr(currentGroupId());
    $('rn-view').innerHTML = gc ? '<div' + gc + '>' + v + '</div>' : v;
    paintBar(); paintPlaces(); paintContext();
    $('rn-layer').innerHTML = S.layer ? S.layer() : '';
    /* the reader's scroll listeners must die with the reader — left alive they keep
       reporting on a detached element, which reads as "read to the end" */
    if (r.v === 'read') hookReader();
    else if (readerCleanup) { readerCleanup(); readerCleanup = null; }
    var srch = $('rn-search'); if (srch && srch.value !== S.q) srch.value = S.q;
    if (r.v === 'search' && !S.handedOff) {
      var target = narrow() ? $('rn-search-m') : srch;
      if (target && document.activeElement !== target) {
        target.focus();
        if (target.setSelectionRange) target.setSelectionRange(target.value.length, target.value.length);
      }
    }
    S.handedOff = false;
  }

  function phead(o) {
    return '<div class="phead"><div class="phead-top">' +
      (o.glyph ? (o.glyphFor
        ? '<button class="glyph glyph-btn" data-a="icon" data-i="' + esc(o.glyphFor) + '" title="Change this icon">' +
          o.glyph + '<span class="gl-pen">' + ico('edit') + '</span></button>'
        : '<div class="glyph">' + o.glyph + '</div>') : '') +
      '<div style="min-width:0;flex:1"><h1 class="ptitle">' + esc(o.title) + '</h1>' +
      (o.sub ? '<div class="psub">' + o.sub + '</div>' : '') + '</div>' +
      (o.actions ? '<div class="phead-actions">' + o.actions + '</div>' : '') +
      '</div></div>';
  }

  function viewHome() {
    var roots = kids(null);
    var un = allUnread();
    var notes = 0; roots.forEach(function (g) { notes += tally(g.id).notes; });
    var body = '';
    if (un.length) {
      body += '<div class="panel" style="margin-bottom:22px"><div style="display:flex;align-items:center;gap:12px">' +
        '<div style="flex:1"><div class="panel-title">' + un.length + ' new since Friday</div>' +
        '<div class="panel-sub">' + esc(un.slice(0, 2).map(function (n) { return n.name; }).join(' · ')) +
        (un.length > 2 ? ' and ' + (un.length - 2) + ' more' : '') + '</div></div>' +
        '<button class="btn" data-a="goinbox">Open</button></div></div>';
    }
    var allGroups = Object.keys(N).filter(function (k) { return N[k].t === 'g'; }).length;
    body += '<div class="list">' + roots.map(groupRow).join('') + addRow('g', '', 'New group') + '</div>';
    return phead({
      title: 'Your groups',
      sub: '<span class="num">' + plural(notes, 'note') + '</span><span class="dot-sep">·</span><span class="num">' +
           plural(allGroups, 'group') + ', ' + roots.length + ' at the top</span><span class="dot-sep">·</span><span>last change ' + esc(ago(lastTouch(null) || NOW.toISOString())) + '</span>',
      actions: '<button class="btn btn-primary wide-only" data-a="add" data-i="">' + ico('plus') + 'Add</button>'
    }) + body;
  }

  function viewGroup(g) {
    if (!g) return viewHome();
    var t = tally(g.id), sh = effShare(g.id), nf = effNotify(g.id);
    var mem = sh.v === 'people' ? shareMembers(g) : [];
    var chips = [];
    chips.push('<span class="chip">' + esc(PRESETS[g.preset] ? PRESETS[g.preset].name : 'Group') + '</span>');
    if (sh.v === 'people') chips.push('<span class="chip chip-accent">' + ico('people') + esc(mem.map(function (m) { return P[m].name; }).join(' & ')) + '</span>');
    else if (sh.v === 'link') chips.push('<span class="chip">Anyone with the link</span>');
    else chips.push('<span class="chip chip-line">Only you</span>');
    if (g.s.privacy) chips.push('<span class="chip chip-private">' + ico('lock') + 'Locking on</span>');
    if (g.s.reading) chips.push('<span class="chip">' + ico('book') + 'Reading mode</span>');
    chips.push('<span class="chip chip-line num">' + (nf.add || nf.edit ? notifyWord(nf) : 'No alerts') + '</span>');

    var actions = '<button class="btn btn-primary wide-only" data-a="add" data-i="' + g.id + '">' + ico('plus') + 'Add</button>' +
      (g.s.shuffle !== 'off' ? '<button class="btn btn-ghost" data-a="shuffle" data-i="' + g.id + '">' + ico('shuffle') + 'Shuffle</button>' : '') +
      '<button class="btn btn-ghost" data-a="gset" data-i="' + g.id + '">' + ico('gear') + 'Settings</button>';

    var head = crumbs(g.id) + phead({
      glyph: iconHtml(g.s.icon), glyphFor: g.id, title: g.name, sub: chips.join(''), actions: actions
    });

    var ks = kids(g.id);
    if (!ks.length) return head + emptyGroup(g);
    if (g.s.sectionsAs === 'columns' && g.s.memberSections) return head + perspectives(g);
    if (g.s.memberSections && g.s.sectionsAs === 'lists' && ks.every(function (k) { return k.t === 'g' && k.owner; })) return head + memberLists(g);
    if (isJournal(g)) return head + journal(g);
    if (g.s.layout === 'cards') return head + shelf(g);

    var subs = ks.filter(function (k) { return k.t === 'g'; });
    var nts = sortKids(ks.filter(function (k) { return k.t === 'n'; }), g.s.sort);
    var out = '';
    if (subs.length || true) {
      out += '<div class="sec"><div class="sec-head"><span class="sec-title">' +
        (g.s.files ? 'Folders' : 'Subgroups') + '</span>' +
        (subs.length ? '<span class="sec-note num">' + subs.length + '</span>' : '') + '</div>' +
        '<div class="list">' + subs.map(groupRow).join('') + addRow('g', g.id) + '</div></div>';
    }
    var vis = shown(nts);
    out += '<div class="sec"><div class="sec-head"><span class="sec-title">Notes</span>' +
      '<span class="sec-note num">' + esc(LBL.sort[g.s.sort]) + '</span></div>' +
      '<div class="list">' + vis.list.map(function (n) { return noteRow(n, g); }).join('') + addRow('n', g.id) + '</div>' +
      hiddenLine(vis) + '</div>';
    return head + out;
  }

  function emptyGroup(g) {
    return '<div class="empty"><div class="empty-mark"></div>' +
      '<h2>Nothing in ' + esc(g.name) + ' yet</h2>' +
      '<p>Start writing. You can sort it into subgroups later, or never.</p>' +
      '<button class="btn btn-primary btn-lg" data-a="newnote" data-i="' + g.id + '">' + ico('plus') + 'Add a note</button>' +
      '<div style="margin-top:16px"><button class="btn btn-quiet" data-a="newgroup" data-i="' + g.id + '">or add a subgroup</button></div></div>';
  }

  /* a group whose children are all groups that contain only notes → day sections */
  function isJournal(g) {
    var ks = kids(g.id);
    if (!ks.length || g.s.sort !== 'new') return false;
    return ks.every(function (k) { return k.t === 'g' && kids(k.id).length && kids(k.id).every(function (c) { return c.t === 'n'; }); });
  }
  /* ---- journal controls: who wrote it, and which end you start from ---- */
  function segbar(items) {
    return '<div class="seg">' + items.map(function (it) {
      return '<button data-a="' + it[0] + '" data-v="' + it[1] + '" aria-pressed="' + (it[3] ? 'true' : 'false') + '">' + esc(it[2]) + '</button>';
    }).join('') + '</div>';
  }
  function dayKey(d) {
    var t = '';
    walk(d.id, function (c) { if (c.t === 'n' && c.created > t) t = c.created; });
    return t;
  }
  function byOrder(list, key) {
    var l = list.slice();
    l.sort(function (a, b) {
      var x = key(a), y = key(b);
      if (x === y) return 0;
      return (S.dorder === 'old' ? (x < y ? -1 : 1) : (x > y ? -1 : 1));
    });
    return l;
  }
  function journalBar(g, withPeople) {
    var people = withPeople ? shareMembers(g) : [];
    var who = people.length
      ? segbar([['dwho', 'all', 'Everyone', S.dwho === 'all']].concat(people.map(function (m) {
          return ['dwho', m, P[m].name, S.dwho === m];
        }))) : '';
    var order = segbar([['dorder', 'new', 'Newest first', S.dorder !== 'old'],
                        ['dorder', 'old', 'Oldest first', S.dorder === 'old']]);
    return '<div class="filterbar">' + who + order +
      '<span class="filterbar-note">' + (S.dwho === 'all' || !people.length ? '' : esc(P[S.dwho].name) + ' only') + '</span></div>';
  }

  function journal(g) {
    var days = byOrder(kids(g.id), dayKey);
    var lockable = g.s.privacy;
    var out = journalBar(g, false);
    if (g.owner && g.owner !== ME) {
      out += '<div class="callout callout-quiet">' + ico('people') +
        '<div><b>' + esc(P[g.owner].name) + "'s section.</b> You can read these. Only " + esc(P[g.owner].name) +
        ' can write here, and entries they locked are not listed.</div></div><div style="height:18px"></div>';
    }
    days.forEach(function (d) {
      var ns = byOrder(kids(d.id).filter(function (n) { return n.t === 'n'; }), function (n) { return n.created; });
      if (!ns.length) return;
      var vis = shown(ns);
      if (!vis.list.length && vis.n) {
        /* a day whose every entry is hidden still says so, rather than a gap in the dates */
        out += '<div class="sec sec-day"><div class="sec-head"><span class="sec-title">' + esc(d.name) + '</span></div>' +
          hiddenLine(vis, 'entry') + '</div>';
        return;
      }
      out += '<div class="sec sec-day"><div class="sec-head"><span class="sec-title">' + esc(d.name) + '</span>' +
        '<span class="sec-note num">' + plural(vis.list.length, 'entry').replace('entrys', 'entries') + '</span></div>' +
        '<div class="list">' + vis.list.map(function (n) { return noteRow(n, g); }).join('') + '</div>' +
        hiddenLine(vis, 'entry') + '</div>';
    });
    out += '<div style="margin-top:var(--sec-gap)"><div class="list no-rail">' + addRow('n', g.id) + '</div>' +
      '<div style="padding-left:var(--rail-w);font-size:12.5px;color:var(--text-3);margin-top:2px">' +
      'Files itself under today, named ' + esc('Dream — ' + dateName(NOW.toISOString())) + '</div></div>';
    return out;
  }

  function memberLists(g) {
    var out = journalBar(g, true);
    var subs = kids(g.id).filter(function (sub) {
      return S.dwho === 'all' || (sub.owner || ME) === S.dwho;
    });
    if (!subs.length) {
      return out + '<div class="empty"><div class="empty-mark"></div><h2>Nothing from ' + esc(P[S.dwho] ? P[S.dwho].name : 'them') + ' here</h2>' +
        '<p>Nobody by that name writes in ' + esc(g.name) + ' yet.</p>' +
        '<button class="btn btn-ghost" data-a="dwho" data-v="all">Show everyone</button></div>';
    }
    subs.forEach(function (sub) {
      var owner = sub.owner || ME;
      var ns = [];
      walk(sub.id, function (c) { if (c.t === 'n') ns.push(c); });
      ns = byOrder(ns, function (n) { return n.created; });
      var mine = owner === ME;
      var privCount = ns.filter(function (n) { return n.priv; }).length;
      var vis = shown(ns);
      out += '<div class="sec"><div class="sec-head" style="align-items:center">' +
        avatar(owner, true) +
        '<span class="sec-title" style="letter-spacing:0;text-transform:none;font-size:14px;font-family:var(--f-name)">' + esc(sub.name) + '</span>' +
        (mine ? '<span class="chip chip-accent">You write here</span>' : '<span class="chip">Read only</span>') +
        '<span class="sec-note num">' + plural(vis.list.length, 'entry').replace('entrys', 'entries') + '</span></div>' +
        '<div class="list">' + vis.list.slice(0, 4).map(function (n) { return noteRow(n, g); }).join('') +
        '<div class="row" role="button" tabindex="0" data-a="open" data-i="' + sub.id + '">' +
        '<span class="mark m-group"><i></i></span><span class="row-body"><span class="row-title" style="font-family:var(--f-ui);font-weight:400;color:var(--text-2);font-size:14px">' +
        'All ' + vis.list.length + ' entries by day</span></span><span class="row-trail">' + ico('chev') + '</span></div></div>' +
        hiddenLine(vis, 'entry') +
        (mine && privCount ? '<div style="padding-left:var(--rail-w);font-size:12.5px;color:var(--text-3);margin-top:6px">' +
          plural(privCount, 'entry').replace('entrys', 'entries') + ' locked — ' + esc(others(g).map(function (m) { return P[m].name; }).join(', ')) + ' cannot see ' + (privCount === 1 ? 'it' : 'them') + '.</div>' : '') +
        (!mine ? '<div style="padding-left:var(--rail-w);font-size:12.5px;color:var(--text-3);margin-top:6px">2 entries are locked and not shown.</div>' : '') +
        '</div>';
    });
    return out;
  }

  function shelf(g) {
    var all = sortKids(kids(g.id).filter(function (k) { return k.t === 'n'; }), g.s.sort);
    var vis = shown(all), ns = vis.list;
    var qs = qtList(g.id);
    var cards = ns.map(function (n) {
      var pct = Math.round((S.progress[n.id] != null ? S.progress[n.id] : (n.prog || 0)) * 100);
      var chs = n.book ? n.book.chapters.length : kids(n.id).length;
      var line = pct >= 100 ? 'Finished' : (pct > 0 ? 'Resume at ' + pct + '%' : 'Not started');
      return '<button class="card" data-a="read" data-i="' + n.id + '">' +
        '<div class="card-title"><span class="rowicon">' + iconHtml(noteIcon(n)) + '</span>' + esc(n.name) + '</div>' +
        '<div class="card-sub">' + (n.source ? esc(n.author) + ' <span class="dot-sep">·</span> <span class="chip chip-mono">' + esc(n.source) + '</span>' : 'Yours') +
        (n.words ? ' <span class="dot-sep">·</span> <span class="num">' + Math.round(n.words / 1000) + 'k words</span>' : '') +
        (chs ? ' <span class="dot-sep">·</span> <span class="num">' + chs + ' chapters</span>' : '') + '</div>' +
        '<div class="card-foot"><div style="height:2px;background:var(--line);border-radius:2px;overflow:hidden">' +
        '<span style="display:block;height:100%;width:' + pct + '%;background:' + (pct >= 100 ? 'var(--sage)' : 'var(--accent-solid)') + '"></span></div>' +
        '<div style="margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">' +
        '<span style="font-size:12px;color:' + (pct >= 100 ? 'var(--sage)' : 'var(--text-3)') + '" class="num">' + line + '</span>' +
        (n.tags || []).map(function (t) { return tagChip(t, qs.indexOf(t) >= 0); }).join('') + '</div></div></button>';
    }).join('');
    var shuf = shuffleNote(g.id);
    return '<div class="panel" style="display:flex;gap:14px;align-items:center;margin-bottom:20px">' +
      '<div style="flex:1"><div class="panel-title">Pull something off the shelf</div>' +
      '<div class="panel-sub">No repeats until the shelf is exhausted. ' + ns.filter(function (n) { return !(n.prog > 0); }).length + ' unread left.' +
      (shuf ? ' ' + esc(shuf) : '') + '</div></div>' +
      '<button class="btn btn-primary" data-a="shuffle" data-i="' + g.id + '">' + ico('shuffle') + 'Surprise me</button></div>' +
      '<div class="cards">' + cards + '</div>' +
      hiddenLine(vis) +
      '<div style="margin-top:22px" class="list no-rail">' + addRow('n', g.id) + '</div>';
  }

  /* ===================== perspectives ================================== */
  function perspectives(g) {
    var notes = kids(g.id).filter(function (k) { return k.t === 'n'; });
    var seg = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">' +
      '<div class="seg"><button data-a="pcol" data-v="all" aria-pressed="' + (S.pcol === 'all' ? 'true' : 'false') + '">' +
      (notes.length > 2 ? 'All' : 'Both') + '</button>' +
      notes.map(function (n) {
        var key = pcolKey(n);
        return '<button data-a="pcol" data-v="' + esc(key) + '" aria-pressed="' + (S.pcol === key ? 'true' : 'false') + '">' +
          esc(whoName(n)) + '</button>';
      }).join('') +
      '</div>' +
      '<button class="btn btn-ghost" data-a="addslot" data-i="' + g.id + '">' + ico('plus') + 'Add a column</button>' +
      '<button class="btn btn-ghost" data-a="export">' + ico('down') + 'Export</button></div>';

    var show = notes.filter(function (n) { return S.pcol === 'all' || pcolKey(n) === S.pcol; });
    var cols = show.map(function (n) { return column(n); }).join('');
    return seg + '<div class="cols' + (show.length > 2 ? ' cols-tight' : '') + '"' +
      (show.length === 1 ? ' style="grid-template-columns:1fr"' : '') + '>' + cols + '</div>';
  }
  /* The banner an LLM's column carries wherever it is read on its own — the column
     header says the same thing, and so does the export. */
  function aiBanner(n, c) {
    return '<div class="callout callout-quiet" style="margin-top:18px">' + ico('bot') +
      '<div><b>Written by ' + esc(c.agent) + ', not by a person.</b> ' +
      (c.kind === 'api' ? 'Written straight into this column by an API key called ' + esc(c.label) + '.'
                        : esc(addedBy(c)) + ' pasted it into a slot ' + (c.by === ME ? 'you' : 'they') + ' created, and ' +
                          (c.by === ME ? 'you can' : 'only ' + esc(addedBy(c)) + ' can') + ' edit it.') +
      ' It sits beside the human columns so it can be compared with them — it is not one of them.</div></div>';
  }
  function column(n) {
    var c = contribOf(n);
    if (c) return aiColumn(n, c);
    var isMine = n.owner === ME;
    return '<div class="col ' + (isMine ? 'mine' : 'theirs') + '">' +
      '<div class="col-head">' + avatar(n.owner) +
      '<span class="col-who">' + esc(whoName(n)) + (isMine ? ' (you)' : '') + '</span>' +
      '<span class="col-tag">' + (isMine ? ico('edit') + 'You can type here' : ico('lock') + 'Read only') + '</span></div>' +
      '<div class="col-body">' + pointsHtml(n, isMine) +
      (isMine ? '<div style="padding:4px 10px 8px 27px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-quiet" data-a="addpoint" data-i="' + n.id + '">' + ico('plus') + 'Add a point</button>' +

  /* ---- the reader: the rail is the scrollbar, and the pages are drawn on top ---- */
  var readerCleanup = null;
  function hookReader() {
    if (readerCleanup) { readerCleanup(); readerCleanup = null; }
    var sc = $('rn-scroll'), fill = $('rn-fill'), flow = $('rn-flow'), marks = $('rn-marks'), pill = $('rn-page');
    if (!sc || !fill) return;
    var nid = S.chapter || S.route.id;
    var bounds = [];
    var pages = 1;

    /* Which element is actually scrolling depends on the width: the reader box has a
       max-height on a desktop, and none at all below 900px, where the window scrolls
       instead. Progress must be read off whichever one it really is — and off neither
       once the reader has been left, or a detached box measures as "read to the end". */
    function scroller() {
      if (!sc.isConnected) return null;
      return sc.scrollHeight > sc.clientHeight + 4 ? sc : null;
    }
    function span() {
      var el = scroller();
      if (el) return { pos: el.scrollTop, max: Math.max(1, el.scrollHeight - el.clientHeight), view: el.clientHeight, inner: true };
      var r = sc.getBoundingClientRect();
      var top = r.top + window.scrollY;
      return { pos: Math.max(0, window.scrollY - top + window.innerHeight * 0.35),
               max: Math.max(1, r.height - window.innerHeight * 0.65), view: window.innerHeight, inner: false };
    }

    function layoutPages() {
      if (!flow || !marks) return;
      marks.innerHTML = '';
      bounds = []; pages = 1;
      var s = span();
      var page = Math.max(520, Math.round(s.view * (narrow() ? 0.86 : 0.94)));
      var total = flow.scrollHeight;
      if (total < page * 1.4) { if (pill) pill.textContent = 'Page 1 of 1'; return; }
      /* candidate break points: the gap above every block, so a page edge never cuts a line */
      var blocks = [].slice.call(flow.children).filter(function (el) { return el.className !== 'pagemarks'; });
      var tops = blocks.map(function (el) { return el.offsetTop; });
      var n = Math.max(1, Math.round(total / page));
      var per = total / n, html = '';
      for (var i = 1; i < n; i++) {
        var want = per * i, best = want, gap = 1e9;
        for (var j = 0; j < tops.length; j++) {
          var d = Math.abs(tops[j] - want);
          if (d < gap) { gap = d; best = tops[j]; }
        }
        if (bounds.length && best - bounds[bounds.length - 1] < 60) continue;
        bounds.push(best);
        html += '<div class="pmark" style="top:' + (best - 17) + 'px"><span>Page ' + (i + 1) + '</span></div>';
      }
      marks.innerHTML = html;
      pages = bounds.length + 1;
    }

    function upd() {
      if (!sc.isConnected) return;
      var s = span();
      var p = Math.max(0, Math.min(1, s.pos / s.max));
      fill.style.height = (p * 100).toFixed(1) + '%';
      if (p > (S.progress[nid] || 0)) { S.progress[nid] = p; persistSoon(); }
      if (pill) {
        /* you are on the page that owns the top of the screen, once its edge has cleared it */
        var lead = 44;
        var here = 1, look = s.inner ? sc.scrollTop + lead : (window.scrollY - (flow ? flow.getBoundingClientRect().top + window.scrollY : 0) + lead);
        for (var i = 0; i < bounds.length; i++) if (bounds[i] <= look) here = i + 2;
        pill.textContent = 'Page ' + here + ' of ' + pages;
      }
    }

    layoutPages();
    var start = S.progress[nid] != null ? S.progress[nid] : (N[nid] ? N[nid].prog || 0 : 0);
    fill.style.height = (start * 100).toFixed(1) + '%';
    /* pick up where you stopped, on whichever element does the scrolling here */
    if (start > 0) {
      var back = span();
      if (back.inner) sc.scrollTop = start * back.max;
      else window.scrollTo(0, Math.max(0, sc.getBoundingClientRect().top + window.scrollY + start * back.max - window.innerHeight * 0.35));
    }
    upd();

    var t = null;
    function onResize() { clearTimeout(t); t = setTimeout(function () { layoutPages(); upd(); }, 140); }
    sc.addEventListener('scroll', upd, { passive: true });
    window.addEventListener('scroll', upd, { passive: true });
    window.addEventListener('resize', onResize);
    readerCleanup = function () {
      sc.removeEventListener('scroll', upd);
      window.removeEventListener('scroll', upd);
      window.removeEventListener('resize', onResize);
    };
    /* jump to a chapter without leaving the flow */
    S.jump = function (i) {
      var h = flow.querySelector('h2.chap[data-ch="' + i + '"]');
      if (!h) return;
      if (scroller()) sc.scrollTo({ top: Math.max(0, h.offsetTop - 8), behavior: 'smooth' });
      else window.scrollTo({ top: h.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
    };
  }

  /* the words of a note, without its markup and without its name — the excerpt is
     what the note says, and the title is already the line above it */
  function textOf(n) {
    return ((n.body || '') + ' ' + ((n.points || []).map(function (p) { return p.text; }).join(' ')))
      .replace(/<[^>]+>/g, ' ')
      .replace(/&nbsp;/g, ' ').replace(/&rsquo;/g, '’').replace(/&lsquo;/g, '‘')
      .replace(/&ldquo;/g, '“').replace(/&rdquo;/g, '”').replace(/&mdash;/g, '—')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/&amp;/g, '&')
      .replace(/\s+/g, ' ').trim();
  }
  function clipText(s, n) {
    s = String(s == null ? '' : s);
    if (s.length <= n) return s;
    return s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…';
  }
  function excerptOf(body, q) {
    if (!body) return '';
    var at = q ? body.toLowerCase().indexOf(q) : -1;
    if (at < 0) return clipText(body, 120);          /* the match was in the title: open with the first line */
    var from = Math.max(0, at - 38);
    if (from > 0) { var sp = body.indexOf(' ', from); if (sp >= 0 && sp < at) from = sp + 1; }
    return (from > 0 ? '…' : '') + clipText(body.slice(from), 130);
  }

         truncates whatever is left rather than widening the page */
      sub: q ? '<span class="echo">for &ldquo;' + esc(clipText(S.q, 90)) + '&rdquo;</span>'
             : '<span>Every note, as you type. Filter by group, tag or date.</span>'
    });
    var mobile = '<div class="only-narrow" style="margin-bottom:20px"><input class="field" id="rn-search-m" value="' + esc(S.q) + '" placeholder="Search every note" data-edit="search"></div>';
    if (!q) {
      return head + mobile + '<div class="setgroup"><div class="setgroup-head"><h3>Try</h3></div><div class="setlist">' +
        ['dream', 'manifest', 'orchestrator', 'ADHD'].map(function (s) {
          return '<button class="setrow" data-a="suggest" data-v="' + s + '"><span class="setrow-main"><span class="setrow-label">' + s + '</span></span>' +
            '<span class="setrow-value">' + ico('search') + '</span></button>';
        }).join('') + '</div></div>';
    }
    var hits = [], hid = { hidden: {}, n: 0 };
    Object.keys(N).forEach(function (k) {
      var n = N[k]; if (n.t !== 'n') return;
      var body = textOf(n);
      if ((n.name + ' ' + body).toLowerCase().indexOf(q) < 0) return;
      var ht = hidingTag(n);
      if (ht) { hid.hidden[ht] = (hid.hidden[ht] || 0) + 1; hid.n += 1; return; }
      hits.push({ n: n, snip: excerptOf(body, q) });
    });
    if (!hits.length) return head + mobile + '<div class="empty"><div class="empty-mark"></div><h2>No note says that</h2>' +
      '<p>Try a shorter word, or search a tag.</p></div>' + hiddenLine(hid, 'match');
    return head + mobile + hiddenLine(hid, 'match') + '<div class="list">' + hits.map(function (h) {
      return '<div class="row" role="button" tabindex="0" data-a="open" data-i="' + h.n.id + '">' + markFor(h.n) +
        '<span class="row-body"><span class="row-title">' + esc(h.n.name) + '</span>' +
        (h.snip ? '<span class="row-excerpt">' + esc(h.snip) + '</span>' : '') +
        '<span class="row-meta num">' + esc(chain(h.n.p).map(function (x) { return x.name; }).join(' / ')) + '<span class="dot-sep">·</span>' + esc(ago(h.n.updated)) + '</span></span>' +
        '<span class="row-trail">' + ico('chev') + '</span></div>';
    }).join('') + '</div>';
  }
