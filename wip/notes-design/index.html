<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- WIP page: keep this out of search results. Remove ONLY when promoting the page to a live path. -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://rosestuffs.org/wip/notes-design/">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#131017">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<title>rosie notes</title>
</head>
<body>
<style>
/* ============================================================================
   rosie-notes — design system
   Navigation: one column, any depth. Signature: the rail.
   Two configurable axes only: data-theme (dark|light) and data-density.
   ========================================================================== */

#rn, #rn *, #rn *::before, #rn *::after { box-sizing: border-box; }

#rn {
  /* ---- type ------------------------------------------------------------ */
  --f-ui: Corbel, "Segoe UI Variable Text", "Segoe UI", Ubuntu, system-ui, sans-serif;
  --f-name: "Sitka Heading", Constantia, "Palatino Linotype", Palatino, Georgia, serif;
  --f-read: "Sitka Text", Constantia, "Palatino Linotype", Georgia, serif;
  --f-mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;

  /* ---- radii / motion -------------------------------------------------- */
  --r1: 7px; --r2: 11px; --r3: 18px; --rf: 999px;
  --t-fast: 120ms cubic-bezier(.2,.8,.2,1);
  --t: 190ms cubic-bezier(.2,.8,.2,1);
  --t-slow: 300ms cubic-bezier(.2,.8,.2,1);

  /* ---- density: roomy (default) ---------------------------------------- */
  --row-py: 10px; --row-gap: 4px; --sec-gap: 30px; --pad: 24px;
  --fs: 15px; --lh: 1.5; --title-fs: 16.5px; --meta-fs: 12.5px;
  --rail-w: 34px; --hdr-py: 26px; --measure: 68ch; --btn-py: 10px; --tap: 40px;

  font-family: var(--f-ui);
  font-size: var(--fs);
  line-height: var(--lh);
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  /* Nothing a person can type may push the page sideways. `clip` rather than `hidden`
     so this never becomes a scroll container and never breaks a sticky header. */
  overflow-x: clip;
}

#rn[data-density="cosy"] {
  --row-py: 6.5px; --row-gap: 2px; --sec-gap: 22px; --pad: 18px;
  --fs: 14.5px; --lh: 1.45; --title-fs: 15px; --meta-fs: 12px;
  --rail-w: 30px; --hdr-py: 18px; --measure: 64ch; --btn-py: 8px; --tap: 34px;
}
#rn[data-density="compact"] {
  --row-py: 3.5px; --row-gap: 0px; --sec-gap: 15px; --pad: 13px;
  --fs: 13.5px; --lh: 1.38; --title-fs: 13.8px; --meta-fs: 11.5px;
  --rail-w: 25px; --hdr-py: 11px; --measure: 58ch; --btn-py: 6px; --tap: 28px;
}

/* ---- palette: dark (default face of the product) ----------------------- */
#rn, #rn[data-theme="dark"] {
  --bg: #131017; --sunk: #0E0C12; --surface: #1A1620; --surface-2: #221D2A;
  --surface-3: #2B2434; --line: #2E2736; --line-soft: #241E2C; --rail: #3A3143;
  --text: #EFEAF3; --text-2: #ABA2B6; --text-3: #877D94;
  --accent: #E79BB4; --accent-solid: #D2698C; --accent-ink: #1B0E14;
  --accent-soft: rgba(210,105,140,.15); --accent-line: rgba(231,155,180,.32);
  --brass: #DCA95E; --brass-soft: rgba(220,169,94,.13);
  --sage: #8CC0A0; --clay: #E8806E; --clay-soft: rgba(232,128,110,.13);
  --peri: #93A6EC; --peri-soft: rgba(147,166,236,.14);
  --shadow: 0 18px 44px -18px rgba(0,0,0,.85), 0 2px 8px -4px rgba(0,0,0,.6);
  --hair: rgba(255,255,255,.045);
}
#rn[data-theme="light"] {
  --bg: #F7F4FA; --sunk: #EFEAF3; --surface: #FFFFFF; --surface-2: #F2ECF6;
  --surface-3: #E8E0EE; --line: #E1D8E8; --line-soft: #EDE7F1; --rail: #D3C6DC;
  --text: #201A27; --text-2: #5C5367; --text-3: #6B6277;
  --accent: #A9426A; --accent-solid: #B4506F; --accent-ink: #FFFFFF;
  --accent-soft: rgba(180,80,111,.10); --accent-line: rgba(169,66,106,.30);
  --brass: #8A6114; --brass-soft: rgba(138,97,20,.10);
  --sage: #2F6E48; --clay: #B23F2C; --clay-soft: rgba(178,63,44,.09);
  --peri: #4C5EBB; --peri-soft: rgba(76,94,187,.10);
  --shadow: 0 16px 36px -20px rgba(40,26,50,.34), 0 1px 3px rgba(40,26,50,.08);
  --hair: rgba(32,26,39,.04);
}

/* ---- accents ------------------------------------------------------------
   Rose is the product's own colour and stays the default. The five others are
   picked to sit clear of the hues that carry meaning — brass = private,
   clay = consequence, sage = fine, periwinkle = somebody else — so no accent
   can ever be mistaken for one of those. Each is checked at 4.5:1 in both
   themes. The same declaration serves the whole app (data-accent on the root)
   and a single group's subtree (data-gc on any element). */
#rn[data-accent="rose"],   #rn [data-gc="rose"] {
  --accent: #E79BB4; --accent-solid: #D2698C; --accent-ink: #1B0E14;
  --accent-soft: rgba(210,105,140,.15); --accent-line: rgba(231,155,180,.32);
}
#rn[data-accent="orchid"], #rn [data-gc="orchid"] {
  --accent: #D2A3F0; --accent-solid: #A96FD8; --accent-ink: #150A1E;
  --accent-soft: rgba(169,111,216,.16); --accent-line: rgba(210,163,240,.32);
}
#rn[data-accent="iris"],   #rn [data-gc="iris"] {
  --accent: #B3AEF5; --accent-solid: #7C7BE0; --accent-ink: #0C0B20;
  --accent-soft: rgba(124,123,224,.17); --accent-line: rgba(179,174,245,.32);
}
#rn[data-accent="cyan"],   #rn [data-gc="cyan"] {
  --accent: #86C9DF; --accent-solid: #3E9CBC; --accent-ink: #05161C;
  --accent-soft: rgba(62,156,188,.18); --accent-line: rgba(134,201,223,.32);
}
#rn[data-accent="teal"],   #rn [data-gc="teal"] {
  --accent: #7FCCBB; --accent-solid: #3FA893; --accent-ink: #04170F;
  --accent-soft: rgba(63,168,147,.17); --accent-line: rgba(127,204,187,.32);
}
#rn[data-accent="slate"],  #rn [data-gc="slate"] {
  --accent: #BFC3CE; --accent-solid: #7C8496; --accent-ink: #0B0D12;
  --accent-soft: rgba(124,132,150,.20); --accent-line: rgba(191,195,206,.32);
}
#rn[data-theme="light"][data-accent="rose"],   #rn[data-theme="light"] [data-gc="rose"] {
  --accent: #A9426A; --accent-solid: #B4506F; --accent-ink: #FFFFFF;
  --accent-soft: rgba(180,80,111,.10); --accent-line: rgba(169,66,106,.30);
}
#rn[data-theme="light"][data-accent="orchid"], #rn[data-theme="light"] [data-gc="orchid"] {
  --accent: #7A34A6; --accent-solid: #7F3FAC; --accent-ink: #FFFFFF;
  --accent-soft: rgba(127,63,172,.10); --accent-line: rgba(122,52,166,.30);
}
#rn[data-theme="light"][data-accent="iris"],   #rn[data-theme="light"] [data-gc="iris"] {
  --accent: #4B45B8; --accent-solid: #514BC0; --accent-ink: #FFFFFF;
  --accent-soft: rgba(81,75,192,.10); --accent-line: rgba(75,69,184,.30);
}
#rn[data-theme="light"][data-accent="cyan"],   #rn[data-theme="light"] [data-gc="cyan"] {
  --accent: #16697F; --accent-solid: #1A7189; --accent-ink: #FFFFFF;
  --accent-soft: rgba(26,113,137,.10); --accent-line: rgba(22,105,127,.30);
}
#rn[data-theme="light"][data-accent="teal"],   #rn[data-theme="light"] [data-gc="teal"] {
  --accent: #10715F; --accent-solid: #147A66; --accent-ink: #FFFFFF;
  --accent-soft: rgba(20,122,102,.10); --accent-line: rgba(16,113,95,.30);
}
#rn[data-theme="light"][data-accent="slate"],  #rn[data-theme="light"] [data-gc="slate"] {
  --accent: #4A5162; --accent-solid: #545C70; --accent-ink: #FFFFFF;
  --accent-soft: rgba(84,92,112,.11); --accent-line: rgba(74,81,98,.30);
}
/* a group's colour reaches its rail, not just its icon */
#rn [data-gc] .list::before,
#rn [data-gc] .points::before { background: color-mix(in srgb, var(--accent-solid) 42%, var(--rail)); }
#rn .row.is-group[data-gc] .mark.m-group i::before { background: var(--accent); opacity: 1; }

/* ---- primitives -------------------------------------------------------- */
#rn h1, #rn h2, #rn h3, #rn h4, #rn p, #rn ul, #rn ol, #rn figure { margin: 0; }
#rn ul, #rn ol { padding: 0; list-style: none; }
#rn button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
#rn input, #rn textarea { font: inherit; color: inherit; }
#rn :focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
#rn .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#rn .ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#rn .num { font-variant-numeric: tabular-nums lining-nums; }

/* ============================ shell ====================================== */
#rn .shell { display: flex; flex-direction: column; min-height: 100vh; }

#rn .topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 0 clamp(12px, 2vw, 20px);
  height: 54px; flex: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
#rn .brand {
  display: flex; align-items: center; gap: 9px;
  font-family: var(--f-name); font-size: 16px; letter-spacing: .01em;
  color: var(--text); white-space: nowrap;
}
#rn .brand-tick { width: 2px; height: 17px; border-radius: 2px; background: var(--accent-solid); flex: none; }
#rn .brand b { font-weight: 600; }
#rn .brand span { color: var(--text-2); font-weight: 400; }

#rn .topbar-search { flex: 1; max-width: 460px; margin: 0 auto; position: relative; }
#rn .topbar-search .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-3); pointer-events: none; }
#rn .topbar-search input {
  width: 100%; height: 34px; padding: 0 12px 0 33px;
  background: var(--surface-2); border: 1px solid transparent;
  border-radius: var(--rf); font-size: 13.5px; color: var(--text);
  transition: border-color var(--t-fast), background var(--t-fast);
}
#rn .topbar-search input::placeholder { color: var(--text-3); }
#rn .topbar-search input:focus { outline: none; border-color: var(--accent-line); background: var(--surface); }

#rn .topbar-end { display: flex; align-items: center; gap: 2px; margin-left: auto; }
#rn .iconbtn {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: var(--r1); color: var(--text-2); font-size: 17px;
  transition: background var(--t-fast), color var(--t-fast); position: relative;
}
#rn .iconbtn:hover { background: var(--surface-2); color: var(--text); }
#rn .iconbtn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
#rn .iconbtn .badge {
  position: absolute; top: 5px; right: 5px; min-width: 7px; height: 7px;
  border-radius: var(--rf); background: var(--accent-solid);
  box-shadow: 0 0 0 2px var(--bg);
}

#rn .frame { flex: 1; display: flex; align-items: stretch; width: 100%; }

/* --- places (wide only) --- */
#rn .places {
  width: 232px; flex: none; padding: 18px 12px 24px;
  border-right: 1px solid var(--line-soft);
  position: sticky; top: 54px; align-self: flex-start;
  max-height: calc(100vh - 54px); overflow-y: auto;
}
#rn .places-label {
  font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
  color: var(--text-3); padding: 0 10px; margin: 22px 0 8px;
}
#rn .places-label:first-child { margin-top: 0; }
#rn .place {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 7px 10px; border-radius: var(--r1); color: var(--text-2);
  font-size: 14px; text-align: left; transition: background var(--t-fast), color var(--t-fast);
}
#rn .place .ico { font-size: 15px; color: var(--text-3); }
#rn .place:hover { background: var(--surface-2); color: var(--text); }
#rn .place[aria-current="true"] { background: var(--accent-soft); color: var(--text); }
#rn .place[aria-current="true"] .ico { color: var(--accent); }
#rn .place .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
#rn .place .dot { margin-left: auto; width: 6px; height: 6px; border-radius: var(--rf); background: var(--accent-solid); }

/* the descent spine — the rail, turned vertical, in the nav */
#rn .spine { padding: 2px 0 0 10px; position: relative; }
#rn .spine::before {
  content: ''; position: absolute; left: 15px; top: 10px; bottom: 14px;
  width: 1px; background: var(--line);
}
#rn .spine-step {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 5px 8px 5px 0; text-align: left; color: var(--text-2);
  font-size: 13.5px; position: relative;
}
#rn .spine-step .bead {
  width: 11px; height: 11px; flex: none; margin-left: -0.5px; border-radius: var(--rf);
  border: 1.5px solid var(--line); background: var(--bg); z-index: 1;
  transition: border-color var(--t-fast), background var(--t-fast);
}
#rn .spine-step:hover { color: var(--text); }
#rn .spine-step:hover .bead { border-color: var(--text-3); }
#rn .spine-step.here { color: var(--text); font-weight: 600; }
#rn .spine-step.here .bead { border-color: var(--accent-solid); background: var(--accent-solid); box-shadow: 0 0 0 3px var(--accent-soft); }
#rn .spine-step .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- stage --- */
#rn .stage { flex: 1; min-width: 0; display: flex; justify-content: center; }
#rn .stage-inner { width: 100%; max-width: 820px; padding: 0 clamp(14px, 3vw, 30px) 120px; }

/* --- context (wide only) --- */
#rn .context {
  width: 288px; flex: none; padding: 24px 22px 40px;
  border-left: 1px solid var(--line-soft);
  position: sticky; top: 54px; align-self: flex-start;
  max-height: calc(100vh - 54px); overflow-y: auto;
}

/* ============================ breadcrumb ================================= */
#rn .crumbs {
  display: flex; align-items: center; gap: 2px; flex-wrap: nowrap;
  overflow-x: auto; scrollbar-width: none;
  padding: 14px 0 0; font-size: 12.5px; color: var(--text-3);
}
#rn .crumbs::-webkit-scrollbar { display: none; }
#rn .crumbs button { color: var(--text-3); white-space: nowrap; padding: 3px 5px; border-radius: 5px; transition: color var(--t-fast), background var(--t-fast); }
#rn .crumbs button:hover { color: var(--text); background: var(--surface-2); }
#rn .crumbs .sep { opacity: .5; user-select: none; }
#rn .crumbs .now { color: var(--text-2); padding: 3px 5px; white-space: nowrap; }

/* ============================ page header ================================ */
#rn .phead { padding: 6px 0 var(--hdr-py); }
#rn .phead-top { display: flex; align-items: flex-start; gap: 14px; }
#rn .glyph {
  width: 42px; height: 42px; flex: none; border-radius: var(--r2);
  display: grid; place-items: center; font-size: 19px;
  background: var(--surface-2); border: 1px solid var(--line-soft);
}
#rn .ptitle {
  font-family: var(--f-name); font-weight: 600; letter-spacing: -.005em;
  font-size: clamp(23px, 3.4vw, 30px); line-height: 1.15; color: var(--text);
  overflow-wrap: anywhere;
}
#rn .psub { margin-top: 6px; font-size: 13.5px; color: var(--text-2); display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; min-width: 0; }
/* a quoted-back value — a search query, a name — is truncated, never a horizontal scrollbar */
#rn .echo { display: inline-block; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
#rn .phead-actions { display: flex; gap: 8px; margin-left: auto; flex: none; }

/* ============================ buttons =================================== */
#rn .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: var(--btn-py) 15px; border-radius: var(--r1);
  background: var(--surface-2); color: var(--text); font-size: 13.5px; font-weight: 500;
  border: 1px solid transparent; white-space: nowrap;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
#rn .btn:hover { background: var(--surface-3); }
#rn .btn:active { transform: translateY(1px); }
#rn .btn .ico { font-size: 15px; }
#rn .btn-primary { background: var(--accent-solid); color: var(--accent-ink); }
#rn .btn-primary:hover { background: color-mix(in srgb, var(--accent-solid) 86%, var(--text)); }
#rn .btn-ghost { background: transparent; border-color: var(--line); color: var(--text-2); }
#rn .btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--line); }
#rn .btn-quiet { background: transparent; color: var(--text-2); }
#rn .btn-quiet:hover { background: var(--surface-2); color: var(--text); }
#rn .btn-danger { background: var(--clay-soft); color: var(--clay); border: 1px solid transparent; }
#rn .btn-danger:hover { background: color-mix(in srgb, var(--clay) 20%, transparent); }
#rn .btn-lg { padding: 13px 22px; font-size: 15px; border-radius: var(--r2); }
#rn .btn-block { width: 100%; }

/* ============================ chips ===================================== */
#rn .chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--rf);
  font-size: 11.5px; font-weight: 500; letter-spacing: .01em;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
#rn .chip .ico { font-size: 12px; stroke-width: 1.8; }
#rn .chip-private { background: var(--brass-soft); color: var(--brass); }
#rn .chip-accent { background: var(--accent-soft); color: var(--accent); }
#rn .chip-peri { background: var(--peri-soft); color: var(--peri); }
#rn .chip-sage { background: color-mix(in srgb, var(--sage) 15%, transparent); color: var(--sage); }
#rn .chip-clay { background: var(--clay-soft); color: var(--clay); }
#rn .chip-line { background: transparent; border: 1px solid var(--line); color: var(--text-3); }
#rn .chip-mono { font-family: var(--f-mono); font-size: 11px; }
/* a quick tag: an ordinary label the group promoted to one click. It carries the
   tag glyph so it is never colour alone, and it is deliberately NOT brass — brass
   is the note lock, and the two must never be read as the same kind of thing. */
#rn .chip-qt .ico { color: var(--text-3); }
#rn .chip-ai {
  background: var(--surface-3); color: var(--text-2);
  border: 1px dashed var(--text-3); font-family: var(--f-mono); font-size: 11px;
}
#rn .chip-ai .ico { color: var(--text-3); }

#rn .dot-sep { color: var(--text-3); opacity: .6; }

/* ============================ THE RAIL — list =========================== */
#rn .list { position: relative; padding: 2px 0; }
#rn .list::before {
  content: ''; position: absolute; left: calc(var(--rail-w) / 2); top: 10px; bottom: 10px;
  width: 1px; background: var(--rail);
}
#rn .list.no-rail::before { display: none; }

#rn .row {
  position: relative; display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) auto;
  align-items: center; column-gap: 4px;
  width: 100%; text-align: left; color: inherit;
  padding: var(--row-py) 0; margin-bottom: var(--row-gap);
  border-radius: var(--r2);
}
#rn .row::after {
  content: ''; position: absolute; inset: -1px 0 -1px var(--rail-w);
  border-radius: var(--r2); background: transparent; z-index: 0;
  transition: background var(--t-fast);
}
#rn .row:hover::after { background: var(--surface); }
#rn .row.is-open::after { background: var(--accent-soft); }
#rn .row > * { position: relative; z-index: 1; }

/* the beads */
#rn .mark { display: grid; place-items: center; height: 100%; }
#rn .mark i {
  display: block; position: relative; width: 13px; height: 13px;
  display: grid; place-items: center;
}
/* group = a branch crossing the rail */
#rn .mark.m-group i::before {
  content: ''; width: 13px; height: 1.5px; border-radius: 2px; background: var(--text-2); opacity: .85;
}
/* unread = filled bead */
#rn .mark.m-unread i::before {
  content: ''; width: 7px; height: 7px; border-radius: var(--rf);
  background: var(--accent-solid); box-shadow: 0 0 0 3.5px var(--bg);
}
/* open = ring */
#rn .mark.m-open i::before {
  content: ''; width: 9px; height: 9px; border-radius: var(--rf);
  border: 1.5px solid var(--accent); background: var(--bg);
}
/* private = brass lock, drawn not tinted */
#rn .mark.m-private i { color: var(--brass); }
#rn .mark.m-private .ico { font-size: 13px; stroke-width: 1.9; background: var(--bg); }

#rn .row-body { min-width: 0; padding-right: 10px; }
#rn .row-title {
  font-size: var(--title-fs); color: var(--text); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
#rn .row.is-group .row-title { font-family: var(--f-name); font-weight: 600; }
#rn .row-meta {
  display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap;
  margin-top: 3px; font-size: var(--meta-fs); color: var(--text-3);
}
#rn .row-excerpt {
  margin-top: 3px; font-size: var(--meta-fs); color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#rn .row-trail { display: flex; align-items: center; gap: 2px; padding-right: 4px; color: var(--text-3); }
#rn .row-trail .ico { font-size: 15px; }
#rn .row-count { font-size: var(--meta-fs); color: var(--text-3); padding: 0 4px; }

/* compact density folds the row onto one line */
#rn[data-density="compact"] .row-body { display: flex; align-items: baseline; gap: 10px; }
#rn[data-density="compact"] .row-meta,
#rn[data-density="compact"] .row-excerpt { margin-top: 0; margin-left: auto; flex: none; white-space: nowrap; }
#rn[data-density="compact"] .row-excerpt { display: none; }

/* the per-note privacy control — one tap, 40px target, never colour alone */
#rn .lockbtn {
  width: var(--tap); height: var(--tap); display: grid; place-items: center;
  border-radius: var(--r1); color: var(--text-3); font-size: 16px;
  transition: background var(--t-fast), color var(--t-fast);
}
#rn .lockbtn { opacity: .8; }
#rn .lockbtn:hover { background: var(--surface-2); color: var(--text-2); opacity: 1; }
#rn .lockbtn[aria-pressed="true"] { opacity: 1; }
#rn .lockbtn[aria-pressed="true"] { color: var(--brass); background: var(--brass-soft); }
#rn .lockbtn[aria-pressed="true"]:hover { background: color-mix(in srgb, var(--brass) 22%, transparent); }

/* ============================ sections ================================== */
#rn .sec { margin-top: var(--sec-gap); }
#rn .sec:first-child { margin-top: 0; }
#rn .sec-head {
  display: flex; align-items: baseline; gap: 10px;
  padding: 0 0 8px var(--rail-w); margin-bottom: 2px;
}
#rn .sec-title { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
#rn .sec-note { font-size: 12px; color: var(--text-3); margin-left: auto; }
#rn .sec-day .sec-title { font-family: var(--f-name); font-size: 13.5px; letter-spacing: 0; text-transform: none; color: var(--text-2); font-weight: 600; }

/* ============================ cards ===================================== */
#rn .panel {
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: var(--r3); padding: var(--pad);
}
#rn .panel + .panel { margin-top: 14px; }
#rn .panel-title { font-family: var(--f-name); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
#rn .panel-sub { font-size: 13px; color: var(--text-2); line-height: 1.55; }

#rn .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
#rn .card {
  text-align: left; padding: 16px; border-radius: var(--r2);
  background: var(--surface); border: 1px solid var(--line-soft);
  transition: border-color var(--t-fast), transform var(--t-fast), background var(--t-fast);
  display: flex; flex-direction: column; width: 100%;
}
#rn .card-foot { margin-top: auto; padding-top: 14px; }
#rn .card:hover { border-color: var(--accent-line); transform: translateY(-1px); }
#rn .card[aria-pressed="true"] { border-color: var(--accent-solid); background: var(--accent-soft); }
#rn .card-title { font-family: var(--f-name); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
#rn .card-sub { margin-top: 5px; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }

/* ============================ icons, emoji, stickers ==================== */
/* A group's or a note's mark is one of three things: an inline icon, any character
   the user types (emoji included), or a file they picked. One renderer for all three. */
#rn .gl { display: inline-grid; place-items: center; line-height: 1; max-width: 100%; overflow: hidden; }
/* A mark is one or two characters. The slot is sized for that and cannot grow past it,
   whatever ends up in the field — a paste of a paragraph is clipped, never scrolled. */
#rn .gl-char {
  font-family: var(--f-name); font-size: 1em;
  display: block; max-width: 1.5em; overflow: hidden;
  white-space: nowrap; text-overflow: clip;
}
#rn .gl-file {
  width: 1.35em; height: 1.35em; border-radius: 5px; font-size: .62em; font-weight: 700;
  border: 1px dashed var(--accent-line); color: var(--accent);
  background: var(--accent-soft); letter-spacing: .02em;
}
#rn .glyph .gl { font-size: 19px; color: var(--accent); }
#rn .glyph.glyph-btn { cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
#rn .glyph.glyph-btn:hover { border-color: var(--accent-line); background: var(--accent-soft); }
#rn .glyph .gl-pen {
  position: absolute; right: -4px; bottom: -4px; width: 17px; height: 17px; border-radius: var(--rf);
  display: grid; place-items: center; font-size: 10px;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text-3);
}
/* not clipped: the pen badge deliberately hangs off the corner. The mark inside is
   clipped by .gl / .gl-char instead. */
#rn .glyph { position: relative; }
#rn .rowicon { flex: none; color: var(--text-3); font-size: 13.5px; display: inline-grid; place-items: center; width: 16px; overflow: hidden; }
#rn .row.is-group .rowicon { color: var(--accent); font-size: 14.5px; }
#rn .row.is-note:hover .rowicon { color: var(--accent); }
#rn .place .gl { font-size: 14px; }

#rn .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 7px; }
#rn .pick button {
  height: 44px; border-radius: var(--r1); display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line-soft); font-size: 19px; color: var(--text-2);
  transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast);
}
#rn .pick button:hover { border-color: var(--accent-line); background: var(--surface-2); color: var(--text); }
#rn .pick button[aria-pressed="true"] { border-color: var(--accent-solid); background: var(--accent-soft); color: var(--accent); }
#rn .pick-label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; margin: 18px 0 9px; }
#rn .pick-label:first-child { margin-top: 0; }

/* ============================ colour picker ============================= */
#rn .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
#rn .sw {
  display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 9px;
  border-radius: var(--rf); background: var(--surface); border: 1px solid var(--line);
  font-size: 13px; color: var(--text-2); transition: border-color var(--t-fast), color var(--t-fast);
}
#rn .sw i { width: 15px; height: 15px; border-radius: var(--rf); flex: none; background: var(--accent-solid); box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
#rn .sw:hover { color: var(--text); border-color: var(--text-3); }
#rn .sw[aria-pressed="true"] { border-color: var(--accent-solid); color: var(--text); background: var(--accent-soft); font-weight: 500; }
#rn .sw-none i { background: transparent; border: 1.5px dashed var(--text-3); }
/* one of your own colours, and the way in to picking a new one */
#rn .sw-own i { box-shadow: inset 0 0 0 1px rgba(0,0,0,.22); }
#rn .sw-new { border-style: dashed; }
#rn .sw-new i { background: conic-gradient(from .25turn, #E79BB4, #DCA95E, #8CC0A0, #86C9DF, #B3AEF5, #E79BB4); }
#rn .sw-hex { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .01em; }
#rn .cpick {
  width: 46px; height: 34px; padding: 0; border: 1px solid var(--line);
  border-radius: var(--r1); background: var(--surface-2); cursor: pointer; flex: none;
}
#rn .cpick::-webkit-color-swatch-wrapper { padding: 3px; }
#rn .cpick::-webkit-color-swatch { border: 0; border-radius: 4px; }
#rn .cprev { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
#rn .cprev > div {
  flex: 1 1 150px; min-width: 0; padding: 12px 13px; border-radius: var(--r2);
  border: 1px solid var(--line-soft);
}
#rn .cprev .cprev-lbl { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }

/* ============================ context column ============================ */
#rn .ctx-label { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
#rn .ctx-block { margin-bottom: 26px; }
#rn .ctx-stat { display: flex; align-items: baseline; justify-content: space-between; padding: 5px 0; font-size: 13px; color: var(--text-2); border-bottom: 1px solid var(--line-soft); }
#rn .ctx-stat b { color: var(--text); font-weight: 600; }
#rn .ctx-actions { display: grid; gap: 7px; }

/* ============================ people ==================================== */
#rn .avatar {
  width: 22px; height: 22px; border-radius: var(--rf); flex: none;
  display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
  letter-spacing: .02em; border: 1px solid var(--line-soft);
}
#rn .avatar.a-rose { background: var(--accent-soft); color: var(--accent); }
#rn .avatar.a-ryla { background: var(--peri-soft); color: var(--peri); }
#rn .avatar.lg { width: 28px; height: 28px; font-size: 12px; }
#rn .faces { display: flex; align-items: center; }
#rn .faces .avatar { box-shadow: 0 0 0 2px var(--bg); }
#rn .faces .avatar + .avatar { margin-left: -5px; }

/* ============================ settings ================================== */
#rn .setgroup { margin-top: var(--sec-gap); }
#rn .setgroup-head { padding: 0 4px 9px; display: flex; align-items: baseline; gap: 10px; }
#rn .setgroup-head h3 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
#rn .setgroup-head p { font-size: 12.5px; color: var(--text-3); margin-left: auto; }
#rn .setlist { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r2); overflow: hidden; }
#rn .setrow {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: calc(var(--row-py) - 1px) 16px; border-top: 1px solid var(--line-soft);
  transition: background var(--t-fast);
}
#rn .setlist > .setrow:first-child, #rn .setlist > div:first-child > .setrow { border-top: 0; }
#rn button.setrow:hover { background: var(--surface-2); }
#rn .setrow-main { min-width: 0; flex: 1; }
#rn .setrow-label { display: block; font-size: 14px; color: var(--text); }
#rn .setrow-help { display: block; font-size: 12.5px; color: var(--text-3); margin-top: 2px; line-height: 1.45; max-width: 52ch; }
#rn .setrow-input { width: 148px; flex: none; padding: 7px 11px; }
#rn .setrow-input.tiny { width: 58px; text-align: center; font-size: 17px; }
#rn .setrow-value { font-size: 13.5px; color: var(--text-2); display: flex; align-items: center; gap: 7px; flex: none; }
#rn .setrow-value .ico { color: var(--text-3); font-size: 15px; transition: transform var(--t); }
#rn .setrow[aria-expanded="true"] .setrow-value .ico { transform: rotate(90deg); }
#rn .setrow.disabled { opacity: .42; pointer-events: none; }
#rn .setopts { padding: 2px 16px 16px calc(16px); display: flex; flex-wrap: wrap; gap: 7px; background: var(--surface-2); border-top: 1px solid var(--line-soft); }
#rn .opt {
  padding: 6px 12px; border-radius: var(--rf); font-size: 13px;
  background: var(--bg); border: 1px solid var(--line); color: var(--text-2);
  transition: all var(--t-fast);
}
#rn .opt:hover { border-color: var(--text-3); color: var(--text); }
#rn .opt[aria-pressed="true"] { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--accent-ink); font-weight: 500; }

/* switch */
#rn .switch {
  width: 42px; height: 25px; border-radius: var(--rf); flex: none; position: relative;
  background: var(--surface-3); border: 1px solid var(--line);
  transition: background var(--t), border-color var(--t);
}
#rn .switch::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px;
  border-radius: var(--rf); background: var(--text-3);
  transition: transform var(--t), background var(--t);
}
#rn .switch[aria-checked="true"] { background: var(--accent-solid); border-color: var(--accent-solid); }
#rn .switch[aria-checked="true"]::after { transform: translateX(17px); background: var(--accent-ink); }

/* segmented */
#rn .seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: var(--rf); }
#rn .seg button {
  padding: 6px 14px; border-radius: var(--rf); font-size: 13px; color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
#rn .seg button:hover { color: var(--text); }
#rn .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.14); }
#rn .seg.wide { display: flex; }
#rn .seg.wide button { flex: 1; }

/* text/path field */
#rn .field {
  width: 100%; padding: 10px 13px; border-radius: var(--r1);
  background: var(--bg); border: 1px solid var(--line); color: var(--text);
  transition: border-color var(--t-fast);
}
#rn .field:focus { outline: none; border-color: var(--accent-line); }
#rn .field-mono { font-family: var(--f-mono); font-size: 12.5px; }
#rn .field-lg { font-family: var(--f-name); font-size: 19px; font-weight: 600; padding: 12px 14px; }

/* inheritance marker — used identically for sharing, notifications, layout */
#rn .inh { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: var(--rf); }
#rn .inh-from { background: transparent; border: 1px dashed var(--line); color: var(--text-3); }
#rn .inh-here { background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }

/* ============================ note / editor ============================= */
#rn .note-title {
  width: 100%; background: transparent; border: 0; padding: 0;
  font-family: var(--f-name); font-weight: 600; letter-spacing: -.005em;
  font-size: clamp(24px, 3.6vw, 32px); line-height: 1.2; color: var(--text);
}
#rn .note-title:focus { outline: none; }
#rn .note-body {
  margin-top: 18px; font-size: calc(var(--fs) + 1px); line-height: 1.72; color: var(--text);
  max-width: var(--measure); min-height: 220px;
}
#rn .note-body:focus { outline: none; }
#rn .note-body p { margin-bottom: 1.05em; }
#rn .note-body h2 { font-family: var(--f-name); font-size: 1.28em; font-weight: 600; margin: 1.5em 0 .45em; }
#rn .note-body ul { list-style: disc; padding-left: 1.3em; margin-bottom: 1.05em; }
#rn .note-body li { margin-bottom: .3em; }
#rn .note-body code { font-family: var(--f-mono); font-size: .87em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
#rn .note-body pre {
  font-family: var(--f-mono); font-size: .82em; line-height: 1.6; background: var(--sunk);
  border: 1px solid var(--line-soft); border-radius: var(--r2); padding: 14px 16px;
  overflow-x: auto; margin-bottom: 1.05em; white-space: pre;
}
#rn .note-body a, #rn .wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
#rn .editbar {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  padding: 7px 8px; margin: 14px 0 0; border-radius: var(--r2);
  background: var(--surface); border: 1px solid var(--line-soft);
}
#rn .editbar .iconbtn { width: 32px; height: 30px; font-size: 15px; }
#rn .editbar .div { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
#rn .editbar .state { margin-left: auto; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; padding-right: 6px; }

/* privacy bar on a note — the highest-stakes control, so it gets real estate */
#rn .privacy {
  display: flex; align-items: center; gap: 14px; padding: 13px 16px;
  border-radius: var(--r2); margin-top: 16px;
  background: var(--surface); border: 1px solid var(--line-soft);
  transition: background var(--t), border-color var(--t);
}
#rn .privacy.on { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 34%, transparent); }
#rn .privacy .ico { font-size: 19px; color: var(--text-3); flex: none; }
#rn .privacy.on .ico { color: var(--brass); }
#rn .privacy-main { flex: 1; min-width: 0; }
#rn .privacy-t { font-size: 14px; font-weight: 600; }
#rn .privacy.on .privacy-t { color: var(--brass); }
#rn .privacy-d { font-size: 12.5px; color: var(--text-3); margin-top: 2px; line-height: 1.45; }

/* ============================ reading mode ============================== */
/* A book is one continuous column with page boundaries drawn over it, the way a
   PDF viewer shows pages while you keep scrolling. Each boundary is snapped to the
   gap above a paragraph, so a page edge never cuts through a line of text. */
#rn .pageflow { position: relative; }
#rn .pagemarks { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
#rn .pmark { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 10px; height: 22px; }
#rn .pmark::before, #rn .pmark::after { content: ''; flex: 1; height: 1px; background: var(--line); }
#rn .pmark span {
  font-family: var(--f-ui); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-3); background: var(--bg); padding: 0 8px; white-space: nowrap;
}
#rn .pagepill {
  position: absolute; right: 4px; bottom: 6px; z-index: 3;
  font-size: 11.5px; color: var(--text-2); padding: 5px 11px; border-radius: var(--rf);
  background: var(--surface-2); border: 1px solid var(--line);
  box-shadow: var(--shadow); pointer-events: none;
}
#rn .reader { position: relative; }
#rn .reader-body h2.chap {
  font-family: var(--f-name); font-size: 1.02em; font-weight: 600; letter-spacing: .02em;
  color: var(--text-2); margin: 2.4em 0 1em; padding-bottom: .5em;
  border-bottom: 1px solid var(--line-soft);
}
#rn .reader-body h2.chap:first-child { margin-top: 0; }
#rn .reader-body h2.chap span { color: var(--text); font-style: italic; }
#rn .bookend {
  margin: 3em 0 1em; padding-top: 1.2em; border-top: 1px solid var(--line-soft);
  font-family: var(--f-ui); font-size: 12.5px; line-height: 1.7; color: var(--text-3);
}
#rn .bookend b { color: var(--text-2); font-weight: 600; }
#rn .reader { display: flex; gap: 0; }
#rn .reader-rail { width: 34px; flex: none; padding-top: 10px; }
#rn .reader-track {
  position: sticky; top: 74px; width: 2px; height: calc(100vh - 210px);
  background: var(--line-soft); border-radius: 2px; margin-left: 12px; overflow: hidden;
}
#rn .reader-fill { display: block; width: 100%; background: var(--accent-solid); border-radius: 2px; height: 0; transition: height 60ms linear; }
#rn .reader-body {
  flex: 1; min-width: 0; font-family: var(--f-read);
  font-size: calc(var(--fs) + 3.5px); line-height: 1.78; color: var(--text);
  max-width: var(--measure); letter-spacing: .002em;
}
#rn .reader-body p { margin-bottom: 1.15em; }
#rn .reader-body p:first-of-type::first-line { letter-spacing: .04em; }
#rn .reader-body h2 { font-family: var(--f-name); font-size: 1.2em; font-weight: 600; margin: 2em 0 .6em; }
#rn .reader-scroll { max-height: calc(100vh - 210px); overflow-y: auto; padding-right: 10px; scrollbar-width: none; -ms-overflow-style: none; }
#rn .reader-scroll::-webkit-scrollbar { display: none; }
#rn .reader-head { font-family: var(--f-name); }

/* ============================ perspectives ============================== */
/* Two people, or two people and a machine: the track count follows the contributors,
   and they stay on one line. Wrapping a third column onto a second row was tried and
   rejected — a tall first column pushes it a screenful down, which is exactly the
   "hidden away" reading a machine-written column must never have. */
#rn .cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(228px, 1fr)); align-items: start; }
/* Three tracks inside an 820px stage is 243px each, and a fifth-level point in 243px
   is one word per line. So past two columns the outline tightens the way the design
   system already tightens it on a phone: less indent, and the number carries the depth
   the indent stops carrying. The text keeps its own full-width line under the bead. */
@media (min-width: 901px) {
  #rn .cols-tight .points { --pind: 9px; }
  #rn .cols-tight .point { flex-wrap: wrap; padding-left: calc(min(var(--d), 2) * var(--pind)); }
  #rn .cols-tight .point.nested::before { left: calc((min(var(--d), 2) - 1) * var(--pind) + 10px); }
  #rn .cols-tight .point .pb { width: 21px; }
  #rn .cols-tight .pnum { font-size: 9.8px; letter-spacing: -.05em; }
  #rn .cols-tight .point-text { flex: 1 1 100%; margin-left: 21px; margin-top: -2px; }
  #rn .cols-tight .pbtn { position: absolute; right: 0; top: 2px; }
  /* "Read only" and "You can type here" stay — knowing whose column you are in before
     you try to type in it is the point of the header. It wraps rather than disappears. */
  #rn .cols-tight .col-head { flex-wrap: wrap; row-gap: 3px; }
  #rn .cols-tight .col-who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rn .cols-tight .col-tag { font-size: 11px; }
}
#rn .col { border-radius: var(--r2); }
#rn .col-head {
  display: flex; align-items: center; gap: 9px; padding: 9px 12px;
  border-radius: var(--r1); margin-bottom: 6px;
}
#rn .col.mine .col-head { background: var(--accent-soft); }
#rn .col.theirs .col-head { background: var(--surface-2); }
#rn .col-who { font-size: 13.5px; font-weight: 600; }
#rn .col-tag { margin-left: auto; font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
#rn .col.theirs .col-body { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r2); padding: 6px 4px; }
#rn .points { position: relative; padding: 4px 0; }

#rn .points { --pind: 16px; }
#rn .point {
  position: relative; display: flex; gap: 8px; padding: 5px 4px 5px 0;
  padding-left: calc(min(var(--d), 4) * var(--pind));
}
/* each level hangs off its own hairline, lined up under its parent's bead */
#rn .point.nested::before {
  content: ''; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line);
  left: calc((min(var(--d), 4) - 1) * var(--pind) + 13px);
}
#rn .point .pb {
  width: 27px; flex: none; align-self: flex-start;
  display: grid; place-items: center; padding-top: .55em;
}
#rn .point .pb i { width: 7px; height: 7px; border-radius: var(--rf); background: var(--line); box-shadow: 0 0 0 3px var(--bg); }
#rn .col.mine .point .pb i { background: var(--accent-solid); }
#rn .col.theirs .point .pb i { background: var(--peri); }
#rn .point.nested .pb i { width: 5px; height: 5px; opacity: .8; }
#rn .point.deep .pb i { width: 4px; height: 4px; opacity: .6; }
#rn .pnum {
  flex: none; font-family: var(--f-mono); font-size: 10.5px; color: var(--text-3);
  padding-top: .55em; letter-spacing: -.03em; opacity: .85;
}

#rn .pbtn {

  display: grid; place-items: center; font-size: 13px; color: var(--text-3);
  opacity: 0; transition: opacity var(--t-fast), background var(--t-fast), color var(--t-fast);
}
#rn .point:hover .pbtn, #rn .point:focus-within .pbtn { opacity: 1; }

@media (max-width: 900px) {

}
#rn .point-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.6; padding: 2px 4px; border-radius: 6px; }
#rn .point-text[contenteditable="true"]:hover { background: var(--surface); }
#rn .point-text[contenteditable="true"]:focus { outline: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent-line); }
#rn .col.theirs .point-text { cursor: default; color: var(--text-2); }
/* stacked on narrow screens: same columns, one above the other */
@media (max-width: 900px) {
  #rn .col + .col { margin-top: 22px; }
  #rn .col-head { position: sticky; top: 54px; z-index: 5; backdrop-filter: blur(10px); }
}

/* ---- filter bar: the same segmented control, used to narrow a journal ---- */
#rn .filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
#rn .filterbar-note { font-size: 12.5px; color: var(--text-3); }

/* ============================ quick tags ================================
   A group's own short list of labels. Applying one is a single click and
   nothing else — no field, no autocomplete, no form to commit.

   The two controls under each tag (show/hide, and what shuffle does with it)
   belong to the person, not to the group, and they change what THIS person's
   devices show. So none of this may borrow the lock's language: no brass, no
   padlock, no "private". Hiding is a curtain; the lock is a door. */
#rn .qtset { display: flex; flex-wrap: wrap; gap: 8px; }
#rn .qtog {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: var(--tap); padding: 8px 15px; border-radius: var(--rf);
  background: var(--bg); border: 1px solid var(--line); color: var(--text-2);
  font-size: 13.5px;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
#rn .qtog:hover { border-color: var(--text-3); color: var(--text); }
#rn .qtog .ico { font-size: 15px; color: var(--text-3); }

  background: var(--accent-solid); border-color: var(--accent-solid);
  color: var(--accent-ink); font-weight: 500;
}

/* editing the list itself — defining a tag, not applying one */
#rn .qtdef { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: var(--rf);
  background: var(--bg); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
#rn .qtdef button { width: 24px; height: 24px; border-radius: var(--rf); display: grid; place-items: center; color: var(--text-3); }
#rn .qtdef button:hover { background: var(--surface-3); color: var(--clay); }
#rn .qtdef .ico { font-size: 13px; }

/* the per-person view controls, one block per tag */
#rn .qtrow { padding: 13px 16px; border-top: 1px solid var(--line-soft); }
#rn .qtrow:first-child { border-top: 0; }
#rn .qtrow-top { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
#rn .qtrow-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
#rn .qtrow-name .ico { font-size: 14px; color: var(--text-3); }
#rn .qtrow-ctl { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
#rn .qtrow-ctl .seg button { padding: 5px 11px; font-size: 12.5px; }
#rn .qtshow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
#rn .qtshow .ico { font-size: 15px; color: var(--text-3); }
#rn .qtrow-note { font-size: 12.5px; color: var(--text-3); margin-top: 9px; line-height: 1.5; max-width: 62ch; }
#rn .qtrow-note b { color: var(--text-2); font-weight: 600; }

/* why a row is not in the list — never a silent disappearance */
#rn .hiddenline {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 0 0 var(--rail-w); font-size: 12.5px; color: var(--text-3);
}

#rn .hiddenline button { color: var(--accent); border-bottom: 1px solid var(--accent-line); font-size: 12.5px; }
#rn .tagbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
#rn .tagbar-none { font-size: 12.5px; color: var(--text-3); }
#rn .btn-sm { padding: 6px 12px; font-size: 12.5px; }

/* ============================ contributor slots =========================
   A Perspectives column is owned by a contributor, which is usually a person
   and does not have to be. A machine-written column gets the same width, the
   same type and the same place in the reading order — comparing it against the
   human columns is the whole point of it being there. What it never gets is
   anything that says a person wrote it: no face, no periwinkle, no serif name.
   Instead: the machine voice on the label, a dashed rail, square beads. */
#rn .col.ai .col-head { background: var(--sunk); border: 1px dashed var(--line); }
#rn .col.ai .col-who { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rn .col.ai .col-body { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r2); padding: 6px 4px; }

#rn .col.ai .point .pb i {

}

#rn .aiglyph {

  border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-size: 14px;
}
#rn .aimark {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--rf);
  font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  background: var(--surface-3); color: var(--text-2); border: 1px dashed var(--text-3); white-space: nowrap;
}
#rn .col-note {
  font-size: 12px; color: var(--text-3); line-height: 1.5;
  padding: 0 4px 8px; margin-top: -2px;
}
#rn .col-note b { color: var(--text-2); font-weight: 600; }
#rn .slotprev {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 12px 14px; border-radius: var(--r2);
  background: var(--surface); border: 1px dashed var(--line);
}

/* ============================ empty state =============================== */
#rn .empty { text-align: center; padding: clamp(40px, 9vh, 80px) 20px; }
#rn .empty-mark { width: 54px; height: 54px; margin: 0 auto 20px; position: relative; }

}

#rn .sheet-body { padding: 12px var(--pad) var(--pad); }

@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* choice cards for the cascade */

@media (max-width: 900px) { #rn .wide-only { display: none; } }
@media (prefers-reduced-motion: reduce) {

<script>

      s: { icon: '¶', layout: 'cards', reading: true, sort: 'least', newNote: 'story',

  /* a list-valued setting (quick tags, who it is shared with) has to be copied, or
