      '<button class="btn btn-quiet" data-a="cancelnew">Cancel</button>' +
      '<button class="btn btn-primary" data-a="creategroup">Create group</button></div>';
  }

  /* ===================== context column ================================ */
  function paintContext() {
    var r = S.route, h = '';
    if ((r.v === 'group' || r.v === 'gset') && N[r.id]) {
      var g = N[r.id], t = tally(g.id), sh = effShare(g.id), nf = effNotify(g.id);
      var people = sh.v === 'people' ? shareMembers(g).filter(function (m) { return m !== ME; }) : [];
      h += '<div class="ctx-block"><div class="ctx-label">This group</div>' +
        '<div class="ctx-stat"><span>Subgroups</span><b class="num">' + t.groups + '</b></div>' +
        '<div class="ctx-stat"><span>Notes</span><b class="num">' + t.notes + '</b></div>' +
        '<div class="ctx-stat"><span>Last change</span><b class="num">' + esc(ago(lastTouch(g.id) || g.updated || NOW.toISOString())) + '</b></div>' +
        (g.s.privacy ? '<div class="ctx-stat"><span>Locked</span><b class="num">' + countPriv(g.id) + '</b></div>' : '') + '</div>';
      h += '<div class="ctx-block"><div class="ctx-label">Who can see it</div>' +
        (people.length
          ? '<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">' + avatar('rose', true) + people.map(function (m) { return avatar(m, true); }).join('') +
            '<span style="font-size:13px;color:var(--text-2)">You and ' + esc(people.map(function (m) { return P[m].name; }).join(', ')) + '</span></div>'
          : '<div style="font-size:13px;color:var(--text-2);margin-bottom:9px">Only you</div>') +
        '<div><span class="inh ' + (sh.here ? 'inh-here' : 'inh-from') + '">' + (sh.here ? 'Set here' : 'from ' + (sh.from ? esc(sh.from.name) : 'Everywhere')) + '</span></div></div>';
      if (g.s.files) {
        h += '<div class="ctx-block"><div class="ctx-label">On disk</div>' +
          '<div style="font-family:var(--f-mono);font-size:11.5px;color:var(--text-2);line-height:1.6;word-break:break-all">' + esc(g.s.folder || resolvePath(g)) + '</div></div>';
      }
      h += '<div class="ctx-block"><div class="ctx-label">Do</div><div class="ctx-actions">' +
        '<button class="btn btn-ghost" data-a="gset" data-i="' + g.id + '">' + ico('gear') + 'Group settings</button>' +
        '<button class="btn btn-ghost" data-a="download" data-i="' + g.id + '">' + ico('down') + 'Download group</button>' +
        '<button class="btn btn-ghost" data-a="notify" data-i="' + g.id + '">' + ico('bell') + esc(notifyWord(nf)) + '</button>' +
        '</div></div>';
    } else if ((r.v === 'note' || r.v === 'read') && N[r.id]) {
      var n = N[r.id];
      if (r.v === 'read') {
        var pct = Math.round((S.progress[r.id] != null ? S.progress[r.id] : (n.prog || 0)) * 100);
        h += '<div class="ctx-block"><div class="ctx-label">Reading</div>' +
          '<div style="font-size:26px;font-family:var(--f-name);font-weight:600" class="num">' + pct + '%</div>' +
          '<div style="font-size:12.5px;color:var(--text-3);margin-top:2px">kept in sync with your phone</div></div>';
      }
      h += '<div class="ctx-block"><div class="ctx-label">About</div>' +
        '<div class="ctx-stat"><span>Created</span><b class="num">' + esc(new Date(n.created).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) + '</b></div>' +
        '<div class="ctx-stat"><span>Updated</span><b class="num">' + esc(ago(n.updated)) + '</b></div>' +
        '<div class="ctx-stat"><span>Written by</span><b>' + esc(whoName(n)) +
          (contribOf(n) ? ' <span class="aimark">' + (contribOf(n).kind === 'api' ? 'API' : 'AI') + '</span>' : '') + '</b></div>' +
        (contribOf(n) ? '<div class="ctx-stat"><span>Added by</span><b>' + esc(addedBy(contribOf(n))) + '</b></div>' : '') +
        (n.words ? '<div class="ctx-stat"><span>Length</span><b class="num">' + n.words.toLocaleString('en-GB') + ' words</b></div>' : '') + '</div>' +
        (n.tags && n.tags.length ? '<div class="ctx-block"><div class="ctx-label">Tags</div><div style="display:flex;gap:6px;flex-wrap:wrap">' +
          n.tags.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') + '</div></div>' : '') +
        '<div class="ctx-block"><div class="ctx-label">Linked from</div><div style="font-size:13px;color:var(--text-3)">Nothing links here yet.</div></div>';
    } else {
      h += '<div class="ctx-block"><div class="ctx-label">Everything</div>' +
        '<div class="ctx-stat"><span>Groups</span><b class="num">' + Object.keys(N).filter(function (k) { return N[k].t === 'g'; }).length + '</b></div>' +
        '<div class="ctx-stat"><span>Notes</span><b class="num">' + Object.keys(N).filter(function (k) { return N[k].t === 'n'; }).length + '</b></div>' +
        '<div class="ctx-stat"><span>Sync</span><b style="color:var(--sage)">Up to date</b></div></div>' +
        '<div class="ctx-block"><div class="ctx-label">Do</div><div class="ctx-actions">' +
        '<button class="btn btn-ghost" data-a="shuffle">' + ico('shuffle') + 'Random note</button>' +
        '<button class="btn btn-ghost" data-a="goapp">' + ico('gear') + 'Settings</button></div></div>';
    }
    $('rn-context').innerHTML = h;
  }
  function countPriv(id) { var c = 0; walk(id, function (x) { if (x.t === 'n' && x.priv) c += 1; }); return c; }

  /* ===================== sheets ======================================== */
  /* the "+ button does" setting decides what the first card actually is */
  function addSheet(gid) {
    var g = gid ? groupOfId(gid) : null;
    gid = g ? g.id : '';
    var where = g ? g.name : 'Home';
    var plus = g ? g.s.plus : 'write';
    var mineHere = g ? kids(g.id).filter(function (n) { return n.t === 'n' && mineNote(n); })[0] : null;

    } else {
      first = '<button class="card" data-a="newnote" data-i="' + (gid || '') + '"><div class="card-title">' + ico('edit') + (g ? esc(LBL.plus[g.s.plus]) : 'Write something') + '</div>' +
        '<div class="card-sub">Starts as a ' + (g ? esc(LBL.newNote[g.s.newNote].toLowerCase()) : 'blank page') +
        (g && g.s.autoName === 'date' ? ', named ' + esc('Dream — ' + dateName(NOW.toISOString())) : '') + '.</div></button>';
    }
    openLayer(function () {
      return '<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">' +
        '<div class="sheet-head"><div style="flex:1"><div class="sheet-title">Add to ' + esc(where) + '</div>' +
        '<div class="sheet-sub">A note is a thing you write. A group holds notes and other groups.</div></div>' +
        '<button class="iconbtn" data-a="close">' + ico('x') + '</button></div>' +
        '<div class="sheet-body"><div class="cards">' + first +
        '<button class="card" data-a="newgroup" data-i="' + (gid || '') + '"><div class="card-title">' + ico('doc') + 'Add a group</div>' +
        '<div class="card-sub">' + (g ? 'Takes its settings from ' + esc(g.name) + '.' : 'Start from a preset or from nothing.') + '</div></button>' +
        (columns ? '<button class="card" data-a="addslot" data-i="' + gid + '"><div class="card-title">' + ico('bot') + 'Add a column</div>' +
          '<div class="card-sub">A contributor who is not a person — an LLM&rsquo;s answer, pasted into a column of its own and labelled as one.</div></button>' : '') +
        '</div></div></div></div>';
    });
  }

  /* ---- the tags panel: the whole of applying a tag ----------------------
     Every quick tag is a toggle. One click adds it, one click takes it off,
     and there is nothing to submit — so this panel has no primary button and
     no field. The two view controls deliberately do NOT live here: this is
     what the note says, not what your screen does with it. */
  function tagSheet(nid) {
    openLayer(function () {
      var n = N[nid];
      if (!n) return '';
      var g = groupOf(n), qs = qtList(g ? g.id : null), have = n.tags || [];
      var src = qtSource(g ? g.id : null);
      var extra = have.filter(function (t) { return qs.indexOf(t) < 0; });
      return '<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">' +
        '<div class="sheet-head"><div style="flex:1"><div class="sheet-title">Tags on &ldquo;' + esc(clipText(n.name, 46)) + '&rdquo;</div>' +
        '<div class="sheet-sub">' + esc(src ? src.name : (g ? g.name : 'This group')) + ' keeps ' + plural(qs.length, 'quick tag') +
        '. Click one to add it, click it again to take it off — nothing to save.</div></div>' +
        '<button class="iconbtn" data-a="close">' + ico('x') + '</button></div>' +
        '<div class="sheet-body">' +
        '<div class="qtset">' + qs.map(function (t) {
          var on = have.indexOf(t) >= 0;
          return '<button class="qtog" data-a="qtag" data-i="' + nid + '" data-v="' + esc(t) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
            ico(on ? 'check' : 'plus') + esc(t) + '</button>';
        }).join('') + '</div>' +
        (extra.length ? '<div class="pick-label">Also on this note</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' + extra.map(function (t) { return tagChip(t, false); }).join('') + '</div>' +
          '<div style="margin-top:8px;font-size:12.5px;color:var(--text-3)">Ordinary tags. Quick tags are the ones ' +
          esc(src ? src.name : 'this group') + ' promoted to a single click; the list lives in its settings.</div>' : '') +
        '<div class="callout callout-quiet" style="margin-top:18px">' + ico('eye') +
        '<div><b>Tags are labels, not permissions.</b> Hiding one changes what your own devices show you — ' +
        esc(g && others(g).length ? others(g).map(function (m) { return P[m].name; }).join(' and ') + ' still ' +
          (others(g).length > 1 ? 'see' : 'sees') + ' these notes' : 'nobody else loses sight of anything') +
        '. The lock on a note is the only thing that keeps anyone out.</div></div>' +
        (g ? '<div class="setlist" style="margin-top:14px">' +
          rowLink('How you see these tags', 'Show or hide each one, and what shuffle does with it. Yours alone.',
            '', 'gset', (src || g).id) + '</div>' : '') +
        '</div><div class="sheet-foot"><button class="btn btn-quiet" data-a="close">Done</button></div></div></div>';
    });
  }

  /* ---- adding a contributor column -------------------------------------- */

    return (a || 'agent') + '-' + P[ME].name;
  }
  function slotSheet(gid) {
    S.slot = { gid: gid, agent: 'claude' };
    openLayer(function () {
      var label = slotLabel();
      return '<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">' +
        '<div class="sheet-head"><div style="flex:1"><div class="sheet-title">Add a column</div>' +
        '<div class="sheet-sub">A column is owned by a contributor. Usually that is a person. It can also be a slot ' +
        'you paste a machine&rsquo;s answer into, so it can be read beside the human ones.</div></div>' +
        '<button class="iconbtn" data-a="close">' + ico('x') + '</button></div>' +
        '<div class="sheet-body"><div class="cards">' +
        '<button class="card" aria-pressed="true"><div class="card-title">' + ico('edit') + 'Paste it in yourself</div>' +
        '<div class="card-sub">You make the column and paste the answer into it. Only you can edit it afterwards.</div></button>' +
        '<button class="card" data-a="apislot"><div class="card-title">' + ico('key') + 'Written by an API key</div>' +

        '<span class="chip">Coming later</span></div></button>' +
        '</div>' +
        '<div class="pick-label">Name it</div>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +

        '" placeholder="claude" data-edit="slotagent" aria-label="Which agent wrote it" spellcheck="false" autocomplete="off">' +
        '<span style="font-size:13px;color:var(--text-3)">added by <b style="color:var(--text-2)">' + esc(P[ME].name) + '</b></span></div>' +
        '<div class="slotprev"><span class="slotprev-name">' + esc(label) + '</span>' +

        '</div><div class="sheet-foot"><button class="btn btn-quiet" data-a="close">Cancel</button>' +
        '<button class="btn btn-primary" data-a="doaddslot">Add ' + esc(label) + '</button></div></div></div>';
    });
  }

  function cascadeSheet(gid, value) {
    var g = N[gid], t = tally(gid);
    var custom = [];
    walk(gid, function (c) { if (c.t === 'g' && c.own.share) custom.push(c); });
    S.casc = { gid: gid, value: value, choice: 'uncustomised', picks: {} };
    custom.forEach(function (c) { S.casc.picks[c.id] = false; });
    var who = value === 'people' ? 'Ryla' : 'anyone with the link';
    openLayer(function () {
      var c = S.casc;
      return '<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1">' +
        '<div class="sheet-head"><div style="flex:1"><div class="sheet-title">Share ' + esc(g.name) + ' with ' + esc(who) + '?</div>' +
        '<div class="sheet-sub">Sharing runs downhill. Everything inside this group follows it unless it says otherwise.</div></div></div>' +
        '<div class="sheet-body">' +
        '<div class="callout">' + ico('warn') + '<div>This will share <b>' + plural(t.groups, 'subgroup') + '</b> and <b>' +
        plural(t.notes, 'note') + '</b> with <b>' + esc(who) + '</b>' +
        (countPriv(gid) ? ', except ' + plural(countPriv(gid), 'locked note') + '.' : '.') + '</div></div>' +
        (custom.length ? '<div style="margin:18px 0 10px;font-size:13.5px;color:var(--text-2)">' +
          plural(custom.length, 'subgroup') + ' inside already ' + (custom.length === 1 ? 'has' : 'have') + ' sharing of ' + (custom.length === 1 ? 'its' : 'their') + ' own.</div>' +
          ['all', 'uncustomised', 'choose'].map(function (k) {
            var meta = {
              all: ['Apply to everything', 'Overwrites those subgroups too. They stop having their own setting.'],
              uncustomised: ['Only where not customised', 'Leaves those ' + custom.length + ' exactly as they are. Everything else follows.'],
              choose: ['Let me choose', 'Go through them one at a time.']
            }[k];
            return '<button class="choice" data-a="casc" data-v="' + k + '" aria-pressed="' + (c.choice === k ? 'true' : 'false') + '">' +
              '<span class="choice-radio"></span><span style="flex:1"><span class="choice-t">' + meta[0] +
              (k === 'uncustomised' ? '<span class="chip chip-sage">Recommended</span>' : '') + '</span>' +
              '<span class="choice-d">' + meta[1] + '</span></span></button>';
          }).join('') +
          (c.choice === 'choose' ? '<div class="setlist" style="margin-top:6px">' + custom.map(function (x) {
            return '<div class="setrow"><span class="setrow-main"><span class="setrow-label">' +
              esc(chain(x.id).map(function (y) { return y.name; }).join(' / ')) + '</span>' +
              '<span class="setrow-help">Currently ' + esc(LBL.share[x.s.share].toLowerCase()) + '</span></span>' +
              '<button class="switch" role="switch" aria-checked="' + (c.picks[x.id] ? 'true' : 'false') + '" data-a="cascpick" data-i="' + x.id + '"></button></div>';
          }).join('') + '</div>' : '')
          : '<div style="margin-top:16px;font-size:13.5px;color:var(--text-2)">Nothing inside has its own sharing, so everything follows this group.</div>') +
        '</div>' +
        '<div class="sheet-foot"><button class="btn btn-quiet" data-a="close">Cancel</button>' +

  function fakeEl(o) { return { getAttribute: function (k) { return o[k] == null ? null : o[k]; }, classList: { contains: function () { return false; } } }; }
  function act(a, el) {
    var id = el.getAttribute('data-i'), v = el.getAttribute('data-v'), k = el.getAttribute('data-k');
    switch (a) {
      case 'home': go({ v: 'home' }); break;
      case 'back': {

      }
      case 'open': {

        var og = groupOf(n);
        /* a member note of a side-by-side group IS that group's screen — a search hit on

        if (og && og.s.memberSections && og.s.sectionsAs === 'columns') {

      case 'chapter': S.chapter = id; histPush(); render(); break;
      case 'jump': if (S.jump) S.jump(parseInt(v, 10) || 0); break;
      case 'gset': go({ v: 'gset', id: id }); break;
      case 'notify': S.open = id ? 'nf:' + id : null; go({ v: 'notify', id: id || null }); break;
      case 'goapp': go({ v: 'app' }); break;
      case 'goinbox': go({ v: 'inbox' }); break;
      case 'search': go({ v: 'search' }); break;
      case 'suggest': S.q = v; go({ v: 'search' }); break;

      case 'menu': if (S.menu) closeLayers(); else openMenu('view'); break;

        render();
        toast(was2
          ? ht + ' hidden from your lists' + (hs && N[hs] ? ' in ' + N[hs].name : '') + '. Only on your devices.'
          : ht + ' is showing again' + (hs && N[hs] ? ' in ' + N[hs].name : '') + '.');
        break;
      }
      case 'qtshow': {
        var st = cleanTag(v), ss = currentGroupId() || '';
        setTagPref(ss, st, { show: true });
        render();
        toast(st + ' is showing again' + (ss && N[ss] ? ' in ' + N[ss].name : '') + '.');
        break;
      }
      case 'qtshuf': {
        var ft = cleanTag(k);
        if (!ft) break;
        setTagPref(id || '', ft, { shuffle: v });
        render();
        toast(v === 'exclude' ? 'Shuffle will skip ' + ft
          : (v === 'only' ? 'Shuffle will pull only ' + ft : 'Shuffle treats ' + ft + ' like anything else'));
        break;
      }
      case 'qtfollow': {
        clearTagPref(id || '', cleanTag(v));
        render();
        toast('Following the level above again');
        break;
      }
      case 'qtadd': {
        var qg = tgtOf(id), fresh = cleanTag(S.qtNew);
        if (!qg) break;
        if (!fresh) { toast('Type a tag first'); break; }
        qg.s.quickTags = (qg.s.quickTags || []).slice();
        /* a list with both NSFW and nsfw on it helps nobody, so the check ignores case
           while the tag itself keeps whatever case it was typed in */
        var dupe = qg.s.quickTags.filter(function (x) { return x.toLowerCase() === fresh.toLowerCase(); })[0];
        if (dupe) { toast(dupe + ' is already on the list'); break; }
        if (qg.s.quickTags.length >= 8) { toast('Eight is plenty — quick tags stay quick by staying few'); break; }
        qg.s.quickTags.push(fresh);
        S.qtNew = '';
        persist(); render();
        toast(fresh + ' is a quick tag in ' + (qg.name || 'this group'));
        break;
      }
      case 'qtdel': {
        var dg = tgtOf(id), gone2 = cleanTag(v);
        if (!dg) break;
        dg.s.quickTags = (dg.s.quickTags || []).filter(function (x) { return x !== gone2; });
        persist(); render();
        toast(gone2 + ' is no longer a quick tag. Notes already carrying it keep it.');
        break;
      }
      /* ---- contributor slots ---- */
      case 'addslot': slotSheet(id || currentGroupId()); break;
      case 'apislot':
        toast('API keys come later. The column already knows how to be written by one.');
        break;
      case 'doaddslot': {
        var sl = S.slot;
        if (!sl || !N[sl.gid]) break;
        var lbl = slotLabel(), iso3 = NOW.toISOString().slice(0, 16);
        var agent = (cleanTag(sl.agent) || 'agent').replace(/\s+/g, '-');
        var sid = 'slot-' + (SEQ += 1) + '-' + Math.floor(Math.random() * 1679616).toString(36);
        Nt(sid, sl.gid, lbl, {
          owner: ME, created: iso3, updated: iso3,
          contrib: { kind: 'manual', agent: agent.charAt(0).toUpperCase() + agent.slice(1),
                     by: ME, label: lbl, added: iso3, made: true },
          points: [{ id: 'p' + (SEQ += 1), depth: 0, text: '' }]
        });
        bust();
        S.slot = null; S.pcol = 'all';
        go({ v: 'group', id: sl.gid });
        persist();
        setTimeout(function () {
          var ed = document.querySelector('.col.ai [data-edit="point"]');
          if (ed) ed.focus();
        }, 220);
        toast(lbl + ' added. It is marked machine-written wherever it is read, exports included.');
        break;
      }
      case 'casc': if (S.casc) { S.casc.choice = v; render(); } break;
      case 'cascpick': if (S.casc) { S.casc.picks[id] = !S.casc.picks[id]; render(); } break;
      case 'cascapply': {
        var c = S.casc, gg = c && N[c.gid];
        if (!gg) break;
        gg.s.share = c.value; gg.own.share = true;
        if (c.value === 'people' && !(gg.s.shareWith || []).length) gg.s.shareWith = ['rose', 'ryla'];
        var moved = 0;
        walk(c.gid, function (x) {
          if (x.t !== 'g' || !x.own.share) return;
          if (c.choice === 'all' || (c.choice === 'choose' && c.picks[x.id])) { x.own.share = false; moved += 1; }
        });
        closeLayers();
        toast(moved === 0
          ? 'Shared. Subgroups with their own sharing were left alone.'
          : 'Shared. ' + moved + ' subgroup' + (moved === 1 ? ' now follows' : 's now follow') + ' this one.');
        break;
      }
      case 'download': downloadSheet(id || currentGroupId()); break;
      case 'dodownload': closeLayers(); toast('Written to ' + (N[id].s.folder || 'your downloads')); break;
      case 'export': exportSheet(); break;
      case 'doexport': closeLayers(); toast(v + ' exported with both columns'); break;
      case 'gset-notify': GLOBAL[k] = !GLOBAL[k]; render(); break;
      case 'nfinherit': {
        var gn = N[id];
        gn.own.notify = !gn.own.notify;
        if (gn.own.notify) { var e = effNotify(gn.p || gn.id); gn.s.notifyAdd = e.add; gn.s.notifyEdit = e.edit; }
        render();
        break;
      }
      case 'nfset': { var gm = N[id]; gm.own.notify = true; gm.s[k] = !gm.s[k]; render(); break; }
      case 'shuffle': {
        var pool = [];
        var scope = id || (S.route.v === 'group' ? S.route.id : null);
        if (scope) walk(scope, function (x) { if (x.t === 'n') pool.push(x); });
        else Object.keys(N).forEach(function (kk) { if (N[kk].t === 'n') pool.push(N[kk]); });
        /* Include · Exclude · Only, per tag, per person — so "give me only the NSFW
           ones" needs no filter built, and an excluded tag can never be pulled up */
        var everything = pool.length;
        pool = shufflePool(pool, scope);
        var byTag = everything - pool.length;
        pool = pool.filter(function (x) { return S.shuffled.indexOf(x.id) < 0; });
        if (!pool.length) {
          if (byTag && !S.shuffled.length) { toast(shuffleNote(scope) + ' Nothing here matches.'); break; }
          S.shuffled = []; toast('Shelf exhausted — starting over'); break;
        }
        pool.sort(function (a, b) { return (a.prog || 0) - (b.prog || 0); });
        var pick = pool[Math.floor(Math.random() * Math.min(3, pool.length))];
        S.shuffled.push(pick.id);
        act('open', fakeEl({ 'data-i': pick.id }));
        toast('Pulled ' + pick.name + ' off the shelf' + (byTag ? ' — ' + shuffleNote(scope) : ''));
        break;
      }
      case 'pcol': S.pcol = v; histReplace(); render(); break;
      case 'dwho': S.dwho = v || 'all'; histReplace(); render(); break;
      case 'dorder': S.dorder = v || 'new'; histReplace(); render(); break;
      case 'addpoint': case 'addsub': case 'addunder': {
        var note = N[id];
        if (!note) break;
        note.points = note.points || [];
        var at = note.points.length, depth = 0;
        if (a === 'addsub' && note.points.length) depth = pdepth(note.points[note.points.length - 1]) + 1;
        if (a === 'addunder') {
          var pid = el.getAttribute('data-p');
          for (var pi = 0; pi < note.points.length; pi++) {
            if (note.points[pi].id === pid) {
              depth = pdepth(note.points[pi]) + 1;
              at = pi + 1;
              /* land after everything already hanging off that point */
              while (at < note.points.length && pdepth(note.points[at]) >= depth) at += 1;
              break;
            }
          }
        }
        var np = { id: 'p' + (SEQ += 1), text: '', depth: depth };
        note.points.splice(at, 0, np);
        note.updated = NOW.toISOString().slice(0, 16);
        render();
        setTimeout(function () {
          var ed = document.querySelector('[data-edit="point"][data-p="' + np.id + '"]');
          if (ed) ed.focus();
        }, 40);
        break;
      }
      case 'readonly': toast(v + ' wrote this. Add your own point instead.', 'brass'); break;
      case 'exec': {
        var parts = v.split(':');
        try { document.execCommand(parts[0], false, parts[1] || null); } catch (e) { /* nothing */ }
        break;
      }
      case 'link': toast('Type [[ in the note to link to another one'); break;
      case 'close': closeLayers(); break;
      case 'noop': toast('Not part of this walkthrough'); break;
      default: break;
    }
  }

  /* ===================== events ======================================= */
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest || !ev.target.closest('#rn')) return;
    var el = ev.target.closest('[data-a]');
    if (!el) { if (S.menu) closeLayers(); return; }
    if (el.classList.contains('scrim') && ev.target !== el) return;
    ev.preventDefault();
    act(el.getAttribute('data-a'), el);
  });
  function isTyping(t) {
    if (!t || !t.tagName) return false;
    return t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable;
  }
  /* how many characters into an editable box the caret sits, and how to put it back */
  function caretOffset(el) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !el.contains(sel.anchorNode)) return null;
    var live = sel.getRangeAt(0), r = document.createRange();
    r.selectNodeContents(el);
    try { r.setEnd(live.endContainer, live.endOffset); } catch (e) { return null; }
    return r.toString().length;
  }
  function putCaret(el, n) {
    if (n == null) return;
    var sel = window.getSelection();
    if (!sel) return;
    var walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var node = null, left = n, t;
    while ((t = walk.nextNode())) {
      node = t;
      if (left <= t.nodeValue.length) break;
      left -= t.nodeValue.length;
    }
    var r = document.createRange();
    if (node) r.setStart(node, Math.max(0, Math.min(left, node.nodeValue.length)));
    else { r.selectNodeContents(el); }
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  /* Enter in the search field commits the search and hands the results the focus,
     so the keyboard can walk them straight away. */
  function commitSearch(text) {
    if (text != null) S.q = text;
    S.handedOff = true;
    if (S.route.v === 'search') {
      /* typing already keeps the address bar on the query, so committing the same one
         must not leave a duplicate entry for Back to land on and appear to do nothing */
      if (location.hash === routeHash(S.route)) histReplace(); else histPush();
      persistSoon();
      render();
    } else go({ v: 'search' });
    setTimeout(focusResults, 0);
  }
  function focusResults() {
    var view = $('rn-view');
    if (!view) return;
    var first = view.querySelector('.list .row[data-a="open"]');
    var target = first || view.querySelector('.empty h2') || view.querySelector('.ptitle');
    if (!target) return;
    if (!first) target.setAttribute('tabindex', '-1');
    target.focus();
    if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && layerCount()) { ev.preventDefault(); closeLayers(); return; }
    if (ev.key === 'Enter' && ev.target.getAttribute && ev.target.getAttribute('data-edit') === 'search') {
      ev.preventDefault();
      commitSearch(ev.target.value);
      return;
    }
    /* Enter commits the small one-field forms, where reaching for the button is a
       waste of a keystroke: defining a quick tag, and naming a contributor slot */
    if (ev.key === 'Enter' && ev.target.getAttribute) {
      var ek = ev.target.getAttribute('data-edit');
      if (ek === 'qtnew') {
        ev.preventDefault();
        S.qtNew = ev.target.value;
        act('qtadd', fakeEl({ 'data-i': ev.target.getAttribute('data-i') || (S.route.v === 'gset' ? S.route.id : '@draft') }));
        return;
      }
      if (ek === 'slotagent') { ev.preventDefault(); act('doaddslot', fakeEl({})); return; }
    }
    /* Tab / Shift-Tab moves a point in and out a level, the way every outliner does it.
       Re-indenting re-renders the point, so the caret has to be put back where it was —
       otherwise the next thing typed lands in front of everything already written. */
    if (ev.key === 'Tab' && ev.target.getAttribute && ev.target.getAttribute('data-edit') === 'point') {
      ev.preventDefault();
      var pn = N[ev.target.getAttribute('data-i')], want = ev.target.getAttribute('data-p');
      var caret = caretOffset(ev.target);
      if (!pn || !pn.points) return;
      for (var i = 0; i < pn.points.length; i++) {
        if (pn.points[i].id !== want) continue;
        var cur = pdepth(pn.points[i]);
        var above = i ? pdepth(pn.points[i - 1]) : -1;
        var next = ev.shiftKey ? Math.max(0, cur - 1) : Math.min(above + 1, cur + 1);
        if (next === cur) return;
        var delta = next - cur;
        pn.points[i].depth = next;
        /* whatever hangs off it comes along */
        for (var j = i + 1; j < pn.points.length && pdepth(pn.points[j]) > cur; j++) {
          pn.points[j].depth = Math.max(0, pdepth(pn.points[j]) + delta);
        }
        render();
        var again = document.querySelector('[data-edit="point"][data-p="' + want + '"]');
        if (again) { again.focus(); putCaret(again, caret); }
        return;
      }
      return;
    }
    var el = ev.target.closest && ev.target.closest('[data-a][role="button"], .row[data-a]');
    if (el && (ev.key === 'Enter' || ev.key === ' ') && el.getAttribute('contenteditable') !== 'true') {
      ev.preventDefault(); act(el.getAttribute('data-a'), el); return;
    }
    /* type-to-search: a printable key anywhere that is not a field goes straight to results.
       This is the only search entry that works at every width, sheet open or not. */
    if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.key.length !== 1 || S.layer) return;
    if (isTyping(ev.target) || S.route.v === 'search') return;
    if (!document.getElementById('rn')) return;
    ev.preventDefault();
    S.q = ev.key;
    go({ v: 'search' });
  });
  var saveTimer = null;
  document.addEventListener('input', function (ev) {
    var el = ev.target, kind = el.getAttribute && el.getAttribute('data-edit');
    if (!kind) return;
    var id = el.getAttribute('data-i'), k = el.getAttribute('data-k');
    if (kind === 'title') { N[id].name = el.value; N[id].updated = NOW.toISOString().slice(0, 16); touchSave(); paintPlaces(); }
    else if (kind === 'body') { N[id].body = el.innerHTML; N[id].updated = NOW.toISOString().slice(0, 16); touchSave(); }
    else if (kind === 'point') {
      var note = N[id];
      (note.points || []).forEach(function (p) { if (p.id === el.getAttribute('data-p')) p.text = el.textContent; });
      note.updated = NOW.toISOString().slice(0, 16);
      /* what you paste into a slot you made is worth keeping across a reload */
      if (note.contrib && note.contrib.made) persistSoon();
    } else if (kind === 'setting') {
      tgtOf(id).s[k] = el.value;
      if (k === 'icon' && id !== '@draft') paintPlaces();
    } else if (kind === 'iconchar') {
      var mark = oneMark(el.value);
      setIcon(id, mark || '◇');
      paintPlaces();
      var pos = Math.min(el.selectionStart == null ? mark.length : el.selectionStart, mark.length);
      render();
      var again = document.querySelector('[data-edit="iconchar"]');
      if (again) {
        if (again.value !== mark) again.value = mark;
        again.focus();
        if (again.setSelectionRange) again.setSelectionRange(pos, pos);
      }
    } else if (kind === 'customhex') {
      /* live, and without re-rendering the sheet — a native colour input fires on every
         drag and must not have the element under it replaced mid-pick */
      var hx = normHex(el.value);
      if (hx) { S.cust.hex = hx; setAccent(hx); paintCustom(); }
    } else if (kind === 'gname') {
      N[id].name = el.value;
      var h1 = document.querySelector('.ptitle'); if (h1) h1.textContent = el.value + ' settings';
      paintPlaces();
    }
    else if (kind === 'draftname') { S.draft.name = el.value; }
    else if (kind === 'linkurl') {
      S.link.url = el.value;
      if (!S.link.title) {
        var slug = el.value.replace(/[?#].*$/, '').replace(/\/+$/, '').split('/').pop() || '';
        S.link.title = slug.replace(/[-_]+/g, ' ').replace(/\.\w+$/, '').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }
      var pos = el.selectionStart; render();
      var f = document.querySelector('[data-edit="linkurl"]'); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
    }
    else if (kind === 'linktitle') { S.link.title = el.value; }
    /* the tag being defined is held, not applied — nothing re-renders under the caret */
    else if (kind === 'qtnew') { S.qtNew = el.value; }
    else if (kind === 'slotagent') {
      /* the name is the whole point of this sheet, so the preview has to be live */
      S.slot.agent = el.value;
      var spos = el.selectionStart;
      render();
      var sf = document.querySelector('[data-edit="slotagent"]');
      if (sf) { sf.focus(); if (sf.setSelectionRange) sf.setSelectionRange(spos, spos); }
    }
    else if (kind === 'search') {
      S.q = el.value;
      if (S.route.v !== 'search') {
        /* typing anywhere in the app IS the way into search — never make someone open it first */
        go({ v: 'search' });
      } else { $('rn-view').innerHTML = viewSearch(); paintContext(); histReplace(); persistSoon(); }
      var back = el.id === 'rn-search' ? $('rn-search') : $('rn-search-m');
      if (back && document.activeElement !== back) {
        back.focus();
        if (back.setSelectionRange) back.setSelectionRange(back.value.length, back.value.length);
      }
    }
  });
  function touchSave() {
    var s = $('rn-save'); if (!s) return;
    s.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { var x = $('rn-save'); if (x) x.textContent = 'Saved'; }, 700);
  }
  var wasNarrow = null, rTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rTimer);
    rTimer = setTimeout(function () {
      var nw = narrow();
      if (nw !== wasNarrow) { wasNarrow = nw; render(); }
    }, 180);
  });

  /* ===================== boot ========================================= */
  S.pcol = 'all';
  S.dwho = 'all'; S.dorder = 'new';
  wasNarrow = narrow();
  var saved = restore();
  $('rn').setAttribute('data-theme', S.theme);
  $('rn').setAttribute('data-density', S.density);
  applyAccent();
  /* the URL wins; with nothing in it, pick up where this browser left off */
  var first = parseHash(location.hash && location.hash !== '#' ? location.hash : (saved.route || '#/'));
  if (!routeOk(first)) first = { v: 'home' };
  if (first.v === 'search') S.q = first.q || '';
  /* one entry below the first screen, so Back at the front door stays in the app */
  nav(routeHash(first), { rn: 1, root: 1, layers: 0 }, true);
  enter(first, false, true);
  window.__rn = { N: N, S: S, go: go, kids: kids, act: act, render: render, route: routeHash, parse: parseHash };
})();
</script>

</body>
</html>
