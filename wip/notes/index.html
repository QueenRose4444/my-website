<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The app lives under /wip/ while it is a work in progress, and the nginx rule there already
      sends X-Robots-Tag. This is the belt to that braces: a shared note must not become findable
      with a `site:` search because one layer was missed. See docs/security.md.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Replaced at build time from `product.name` in rosie-notes.config.json. Vite substitutes
      %VITE_*% placeholders in index.html, so a fork's own name reaches the browser tab without
      anyone editing this file.
    -->
    <title>Rosie Notes</title>
    <script type="module" crossorigin src="./assets/index-DBB3snSC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DS0-wopB.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript. The API it talks to does not, if you would rather curl.</noscript>
  </body>
</html>
